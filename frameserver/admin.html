let artSyncing = false
function setSyncButton() {
  const b = $('#artSync')
  if (!b) return
  b.disabled = artSyncing
  b.textContent = artSyncing ? 'Syncing…' : 'Sync now'
}

async function syncArt() {
  artSyncing = true
  setSyncButton()
  let background = false
  try {
    const r = await api('/api/countdown-art/refresh', { method: 'POST' })
    background = !!(r && (r.started || r.running))
    toast(syncResultText(r))
  } catch (e) {
    const m = String(e.message || e)
    toast(m.startsWith('409') ? 'A sync is already running' : `Sync failed: ${m}`)
  }
  artSyncing = false
  setSyncButton()
  loadExtras(true)
  // A sync that runs in the background lands after the answer: look again.
  if (background) for (const ms of [5000, 15000]) setTimeout(() => loadExtras(true), ms)
}

// POST /api/countdown-art/refresh: { ok, count, added, removed, error }, or
// the new art view, or { started } for a sync left running in the background.
function syncResultText(r) {
  const o = r && typeof r === 'object' ? r : {}
  if (o.ok === false || o.error) return `Sync failed: ${o.error || 'no reason given'}`
  if (o.started || o.running) return 'Sync started'
  const n = Array.isArray(r) ? r.length : o.count ?? (Array.isArray(o.items) ? o.items.length : null)
  const changes = [o.added ? `${o.added} new` : '', o.removed ? `${o.removed} removed` : ''].filter(Boolean)
  return 'Synced' + (n != null ? `: ${n} image${n === 1 ? '' : 's'}` : '') +
    (changes.length ? ` (${changes.join(', ')})` : '')
}

// ==== home assistant: the whitelist and the action log =====================
// frameserver/lib/homeAssistant.mjs. Mirrors that module's KINDS and
// SERVICE_ALLOWLIST here (this page has no module loader to import an .mjs
// from) - keep the two in sync by hand if either changes.
const HA_KINDS = ['cover', 'lock', 'door', 'light', 'switch', 'mode', 'select', 'person', 'sensor', 'camera', 'todo', 'other']
const HA_SERVICE_ALLOWLIST = {
  cover: ['open_cover', 'close_cover', 'stop_cover', 'toggle'],
  lock: ['lock', 'unlock'],
  light: ['turn_on', 'turn_off', 'toggle'],
  switch: ['turn_on', 'turn_off', 'toggle'],
  input_boolean: ['turn_on', 'turn_off', 'toggle'],
  input_select: ['select_option'],
  scene: ['turn_on'],
  script: ['turn_on'],
}
const HA_DOMAIN_KIND = {
  light: 'light', switch: 'switch', cover: 'cover', lock: 'lock',
  input_boolean: 'switch', input_select: 'select', select: 'select',
  person: 'person', sensor: 'sensor', binary_sensor: 'sensor', camera: 'camera', todo: 'todo',
}
const haDomainOf = (id) => String(id || '').split('.')[0] || ''
const haDefaultKind = (id) => HA_DOMAIN_KIND[haDomainOf(id)] || 'other'
// "domain.service" options for whichever entity is currently chosen.
const haServiceOptions = (entityId) => {
  const domain = haDomainOf(entityId)
  return (HA_SERVICE_ALLOWLIST[domain] || []).map((s) => [`${domain}.${s}`, s])
}

let haSearchTimer = null

// One card, built once per renderShared() and redrawn in place on every add
// or remove (never re-added: card() would otherwise stack a second section
// on top of the first). Mirrors renderCalendars()'s one-save-at-a-time queue.
function renderHomeAssistant() {
  const c = card('Home Assistant',
    "A whitelist of entities the hub may read and actions it may call - nothing else passes through. " +
    "Screens never talk to Home Assistant directly. Panels that show this on a screen are a later step.")
  const body = make('div')
  c.appendChild(body)

  const model = {
    entities: (Array.isArray(shared.ha?.entities) ? shared.ha.entities : []).map((e) => ({ ...e })),
    actions: (Array.isArray(shared.ha?.actions) ? shared.ha.actions : []).map((a) => ({ ...a })),
    // Off by default: an existing shared.ha without the key (or a fresh
    // seed) reads as false, same as the hub's own actionsEnabled() getter.
    actionsEnabled: shared.ha?.actionsEnabled === true,
  }
  let saving = Promise.resolve()
  const save = () => {
    saving = saving.then(async () => {
      try {
        const merged = await patchShared({
          ha: { entities: model.entities, actions: model.actions, actionsEnabled: model.actionsEnabled },
        })
        if (merged && typeof merged === 'object') shared = merged
      } catch (e) {
        toast(`Not saved: ${e.message || e}`)
        loadAll().catch(() => {})
      }
    })
    return saving
  }

  function redraw() {
    body.innerHTML = ''

    const status = make('div')
    status.id = 'haStatus'
    body.appendChild(status)

    // --- entities ---
    body.appendChild(make('h3', 'ha-sub', 'Entities'))
    const eTable = make('div', 'ha-table')
    const eHead = make('div', 'ha-head')
    for (const t of ['Label', 'Entity ID', 'Kind', 'State', '']) eHead.appendChild(make('span', null, t))
    eTable.appendChild(eHead)
    const eNone = make('p', 'empty-note', 'No entities whitelisted yet. Search for one below.')
    eTable.hidden = model.entities.length === 0
    eNone.hidden = !eTable.hidden

    for (const entry of model.entities) {
      const r = make('div', 'ha-row')
      const label = document.createElement('input')
      label.type = 'text'; label.value = entry.label ?? ''
      label.placeholder = entry.id
      label.setAttribute('aria-label', `Label for ${entry.id}`)
      label.onchange = () => {
        entry.label = label.value.trim()
        label.value = entry.label
        save()
      }
      const kindSel = select(HA_KINDS.map((k) => [k, k]), HA_KINDS.includes(entry.kind) ? entry.kind : haDefaultKind(entry.id),
        (v) => { entry.kind = v; save() })
      const stateEl = make('span', 'ha-state', '…')
      stateEl.dataset.haStateId = entry.id
      const rm = make('button', 'action danger', 'Remove')
      rm.type = 'button'
      rm.onclick = () => {
        if (!confirm(`Remove ${entry.label || entry.id}? Any action using it is removed too.`)) return
        model.entities.splice(model.entities.indexOf(entry), 1)
        model.actions = model.actions.filter((a) => a.entity !== entry.id)
        save()
        redraw()
      }
      r.append(label, make('code', 'ha-id', entry.id), kindSel, stateEl, rm)
      eTable.appendChild(r)
    }
    body.append(eTable, eNone)

    // --- add entity: search Home Assistant live ---
    const search = make('div', 'ha-search')
    const searchInput = document.createElement('input')
    searchInput.type = 'text'
    searchInput.placeholder = 'Search Home Assistant by entity id or name…'
    searchInput.setAttribute('aria-label', 'Search Home Assistant entities')
    const results = make('div', 'ha-search-results')
    results.hidden = true
    searchInput.oninput = () => {
      clearTimeout(haSearchTimer)
      const q = searchInput.value.trim()
      if (!q) { results.hidden = true; results.innerHTML = ''; return }
      haSearchTimer = setTimeout(async () => {
        let list
        try {
          list = await api(`/api/ha/entities?q=${encodeURIComponent(q)}`)
        } catch (e) {
          results.innerHTML = ''
          results.appendChild(make('div', 'ha-search-result', `Search failed: ${e.message || e}`))
          results.hidden = false
          return
        }
        const already = new Set(model.entities.map((e) => e.id))
        const fresh = (Array.isArray(list) ? list : []).filter((x) => !already.has(x.id))
        results.innerHTML = ''
        if (!fresh.length) results.appendChild(make('div', 'ha-search-result', 'No new matches.'))
        for (const x of fresh) {
          const row = make('div', 'ha-search-result')
          const text = make('span', 'ha-id', x.label && x.label !== x.id ? `${x.label} — ${x.id}` : x.id)
          const add = make('button', 'action ghost', 'Add')
          add.type = 'button'
          add.onclick = () => {
            model.entities.push({ id: x.id, label: x.label || x.id, kind: haDefaultKind(x.id) })
            save()
            searchInput.value = ''
            results.hidden = true
            results.innerHTML = ''
            redraw()
          }
          row.append(text, add)
          results.appendChild(row)
        }
        results.hidden = false
      }, 300)
    }
    search.append(searchInput, results)
    body.appendChild(search)

    // --- actions ---
    body.appendChild(make('h3', 'ha-sub', 'Actions'))
    row(body, 'Allow actions from screens',
      'Off: screens can show states but every button is refused. On: any device on the Wi-Fi can trigger ' +
      'these actions through the hub; the dashboard PIN item in BACKLOG.md is meant to pair with this.',
      select([[true, 'On'], [false, 'Off']], model.actionsEnabled,
        (v) => { model.actionsEnabled = v === 'true'; save() }))
    const aTable = make('div', 'ha-actions-table')
    const aHead = make('div', 'ha-head')
    for (const t of ['Label', 'Entity', 'Service', 'Confirm', '']) aHead.appendChild(make('span', null, t))
    aTable.appendChild(aHead)
    const aNone = make('p', 'empty-note', 'No actions yet.')
    aTable.hidden = model.actions.length === 0
    aNone.hidden = !aTable.hidden

    for (const entry of model.actions) {
      const r = make('div', 'ha-row')
      const label = document.createElement('input')
      label.type = 'text'; label.value = entry.label ?? ''
      label.setAttribute('aria-label', `Label for action ${entry.id}`)
      label.onchange = () => {
        entry.label = label.value.trim()
        label.value = entry.label
        save()
      }
      const entitySel = select(model.entities.map((e) => [e.id, e.label || e.id]), entry.entity, (v) => {
        entry.entity = v
        const opts = haServiceOptions(v)
        if (!opts.some(([val]) => val === entry.service)) entry.service = opts[0] ? opts[0][0] : ''
        save()
        redraw()
      })
      const serviceSel = select(haServiceOptions(entry.entity), entry.service, (v) => { entry.service = v; save() })
      const confirmSel = select([['tap', 'Tap'], ['hold', 'Hold']], entry.confirm === 'hold' ? 'hold' : 'tap',
        (v) => { entry.confirm = v; save() })
      const rm = make('button', 'action danger', 'Remove')
      rm.type = 'button'
      rm.onclick = () => {
        if (!confirm(`Remove the action "${entry.label || entry.id}"?`)) return
        model.actions.splice(model.actions.indexOf(entry), 1)
        save()
        redraw()
      }
      r.append(label, entitySel, serviceSel, confirmSel, rm)
      aTable.appendChild(r)
    }
    body.append(aTable, aNone)

    const bar = make('div', 'toolbar')
    const addAction = make('button', 'action ghost', 'Add action')
    addAction.type = 'button'
    if (!model.entities.length) {
      addAction.disabled = true
      addAction.title = 'Add an entity first'
    }
    addAction.onclick = () => {
      const entity = model.entities[0].id
      const opts = haServiceOptions(entity)
      model.actions.push({ id: `action-${Date.now().toString(36)}`, label: '', entity, service: opts[0] ? opts[0][0] : '', confirm: 'tap' })
      save()
      redraw()
    }
    bar.appendChild(addAction)
    body.appendChild(bar)

    // --- recent actions (read-only, painted from loadExtras) ---
    const logWrap = make('div', 'status-block')
    const logTitle = make('h3', null, 'Recent actions')
    logTitle.appendChild(make('small', null, 'newest 20, refreshes every minute'))
    const logBox = make('div', 'ha-log')
    logBox.id = 'haLog'
    logWrap.append(logTitle, logBox)
    body.appendChild(logWrap)

    paintExtras()
  }

  redraw()
}

// A whitelisted entity's live state, in the dashboard's own words rather than
// Home Assistant's raw string, for the kinds this package already knows.
function haStateText(e) {
  if (e == null || e.state == null) return 'no data yet'
  const s = e.state
  if (e.kind === 'door') return s === 'on' ? 'Open' : s === 'off' ? 'Closed' : s
  if (e.kind === 'cover') return s === 'open' ? 'Open' : s === 'closed' ? 'Closed' : s
  if (e.kind === 'lock') return s === 'locked' ? 'Locked' : s === 'unlocked' ? 'Unlocked' : s
  if (e.kind === 'mode' || e.kind === 'switch') return s === 'on' ? 'On' : s === 'off' ? 'Off' : s
  return String(s)
}

function paintHaStatus(box) {
  box.innerHTML = ''
  const ha = extras.ha
  if (!ha) {
    infoRow(box, 'Home Assistant', make('span', 'muted', 'Loading…'))
  } else if (ha.error) {
    infoRow(box, 'Home Assistant', make('span', 'bad', `Could not read /api/ha/state: ${ha.error}`))
  } else {
    const d = ha.data || {}
    infoRow(box, 'Configured', make('span', d.configured ? 'ok' : 'bad', d.configured ? 'Yes' : 'No (HA_URL / token missing on the hub)'))
    infoRow(box, 'Connected', make('span', d.connected ? 'ok' : 'bad', d.connected ? 'Yes' : 'No'))
    infoRow(box, 'Last event', d.lastEventAt ? ageSpan(d.lastEventAt, 'never') : make('span', 'muted', 'none yet'))
    if (d.error) infoRow(box, 'Error', make('span', 'bad', String(d.error)))
  }
  const entities = (extras.ha && extras.ha.data && extras.ha.data.entities) || {}
  for (const el of document.querySelectorAll('[data-ha-state-id]')) {
    el.textContent = ha && !ha.error ? haStateText(entities[el.dataset.haStateId]) : '…'
  }
}

function paintHaLog(box) {
  const log = extras.haLog
  box.innerHTML = ''
  if (!log) return box.appendChild(make('p', 'empty-note', 'Loading…'))
  if (log.error) return box.appendChild(make('p', 'err-line', `Could not read the action log: ${log.error}`))
  const rows = Array.isArray(log.data) ? log.data : []
  if (!rows.length) return box.appendChild(make('p', 'empty-note', 'No actions logged yet.'))
  for (const entry of rows) {
    const row = make('div', 'ha-log-row')
    const ok = !!(entry.result && entry.result.ok)
    row.append(
      make('span', 'when', clockText(entry.time)),
      make('span', null, entry.action),
      make('span', 'muted', entry.entity || ''),
      make('span', 'muted', entry.screen || ''),
      make('span', ok ? 'ok' : 'bad', ok ? 'ok' : (entry.result && entry.result.error) || 'failed'),
    )
    box.appendChild(row)
  }
}
// ==== /home assistant ========================================================

// ==== music videos: the hub's video resolver and collection =================
// frameserver/lib/video*.mjs, docs/designs/music-videos.md. Reads
// GET /api/video/health (every 30 s), GET /api/video/collection and the Sonos
// favorites (every 60 s), and again right after any action. The status lines
// are repainted in place; the favorites and the collection list are redrawn
// only when their data changed and nothing in them has focus, so an open
// "Pick..." box or a half-typed link is never thrown away.
const VIDEO_HEALTH_MS = 30 * 1000
const VIDEO_COLLECTION_MS = 60 * 1000
const VIDEO_FAILS_RED = 3
const GIB = 1024 * 1024 * 1024
let vid = { health: null, collection: null, favorites: null, healthAt: 0, collAt: 0 }
let vidHealthJob = null
let vidCollJob = null
let vidFavSig = null
let vidCollSig = null
const vidPickOpen = new Set()   // keys with the "Pick..." box open
const vidPickText = new Map()   // key -> what has been typed so far

// 12.4 GB, 830 MB. Binary units, so the default 100 GiB cap reads "100 GB".
function fmtBytes(n) {
  if (!Number.isFinite(n) || n <= 0) return '0 MB'
  if (n >= GIB) return `${(n / GIB).toFixed(1).replace(/\.0$/, '')} GB`
  return `${Math.max(1, Math.round(n / (1024 * 1024)))} MB`
}

// The hub may send ISO strings or epoch ms; ageSpan() wants ISO.
function isoOf(v) {
  const t = seenTime(v)
  return t == null ? '' : new Date(t).toISOString()
}

// "Pandora station name (My Station)" is how Sonos labels a user's own
// stations; the trailing tag is noise in a list of names.
const favLabel = (name) => String(name || '').replace(/\s*\(My Station\)\s*$/i, '').trim() || String(name || '')

// True while a text box or dropdown inside box has focus: redrawing then would
// throw away what is being typed or an open menu. (A focused button is fine.)
function inField(box) {
  const a = document.activeElement
  return !!a && box.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)
}

function videoGet(path) {
  return api(path).then((data) => ({ data }), (e) => ({ error: String(e.message || e) }))
}

function loadVideoHealth() {
  if (vidHealthJob) return vidHealthJob
  vidHealthJob = videoGet('/api/video/health')
    .then((h) => { vid.health = h; vid.healthAt = Date.now(); paintVideo() })
    .finally(() => { vidHealthJob = null })
  return vidHealthJob
}

function loadVideoCollection() {
  if (vidCollJob) return vidCollJob
  vidCollJob = Promise.all([videoGet('/api/video/collection'), videoGet('/api/sonos/Main/favorites')])
    .then(([c, f]) => { vid.collection = c; vid.favorites = f; vid.collAt = Date.now(); paintVideo() })
    .finally(() => { vidCollJob = null })
  return vidCollJob
}

// Everything, now: after an action, and when the House-wide pane opens stale.
function loadVideo(force) {
  const jobs = []
  if (force || Date.now() - vid.healthAt >= VIDEO_HEALTH_MS) jobs.push(loadVideoHealth())
  if (force || Date.now() - vid.collAt >= VIDEO_COLLECTION_MS) jobs.push(loadVideoCollection())
  return Promise.all(jobs)
}

function renderVideos() {
  const c = card('Music videos',
    'The official video for whatever is playing on Sonos, matched and kept by the hub for the Apple TV. ' +
    'Pick which Sonos favorites get videos, and fix wrong matches here.')
  const status = make('div'); status.id = 'vidStatus'
  const capBox = make('div'); capBox.id = 'vidCap'
  const favs = make('div', 'status-block'); favs.id = 'vidFavs'
  const coll = make('div', 'status-block'); coll.id = 'vidColl'
  c.append(status, capBox, favs, coll)

  // The cap is built once and only its value is refreshed (paintVideoStatus),
  // so a health tick never replaces the box mid-edit.
  const cap = numberInput('', async (gb) => {
    if (gb == null || !Number.isFinite(gb) || gb < 1) { toast('Cap must be at least 1 GB'); paintVideoStatus(); return }
    try {
      const merged = await patchShared({ video: { capBytes: Math.round(gb * GIB) } })
      if (merged && typeof merged === 'object') shared = merged
    } catch (e) { toast(`Not saved: ${e.message || e}`) }
    loadVideoHealth()
  }, { min: 1, step: 1 })
  cap.id = 'vidCapInput'
  row(capBox, 'Cache cap (GB)', 'Least recently played videos are removed above this. Hand-picked files are never counted.', cap)

  vidFavSig = null
  vidCollSig = null
  paintVideo()
  loadVideo()
}

function paintVideo() {
  if (!$('#vidStatus')) return
  paintVideoStatus()
  paintVideoFavorites()
  paintVideoCollection()
  updateAges()
}

function paintVideoStatus() {
  const box = $('#vidStatus')
  const capBox = $('#vidCap')
  if (!box) return
  box.innerHTML = ''
  const h = vid.health
  capBox.hidden = true
  if (!h) { infoRow(box, 'Music videos', make('span', 'muted', 'Loading…')); return }
  if (h.error) { infoRow(box, 'Music videos', make('span', 'bad', `Could not read /api/video/health: ${h.error}`)); return }
  const d = h.data || {}
  if (!d.configured) {
    infoRow(box, 'Configured', make('span', 'bad', 'Not configured: set MUSIC_VIDEOS_DIR on the hub'))
    return
  }
  const cfg = make('span', 'ok', 'Yes')
  infoRow(box, 'Configured', (() => {
    const w = make('span'); w.append(cfg, document.createTextNode(' '), make('code', null, String(d.dir || '')))
    return w
  })())
  infoRow(box, 'Reachable', make('span', d.reachable ? 'ok' : 'bad', d.reachable ? 'Yes' : 'No (the folder cannot be read right now)'))

  const y = d.ytdlp || {}
  const yl = make('span')
  yl.append(document.createTextNode(y.version ? `${y.version} · last OK ` : 'not found · last OK '))
  yl.appendChild(y.lastOkAt ? ageSpan(isoOf(y.lastOkAt), 'never') : make('span', 'muted', 'never'))
  infoRow(box, 'yt-dlp', yl)
  const fails = Number(y.consecutiveFailures) || 0
  const red = fails >= VIDEO_FAILS_RED
  const fl = make('span', red ? 'bad' : (fails ? '' : 'ok'),
    fails ? `${fails} in a row${red && y.lastError ? `: ${y.lastError}` : ''}` : 'None')
  infoRow(box, 'Consecutive failures', fl)
  const f = d.ffmpeg || {}
  infoRow(box, 'ffmpeg', make('span', f.found ? 'ok' : 'bad', f.found ? 'Found' : 'Not found'))
  const q = d.queue || {}
  infoRow(box, 'Queue', make('span', null, `${q.resolving ?? 0} resolving, ${q.downloading ?? 0} downloading`))
  const ca = d.cache || {}
  const capBytes = ca.capBytes || (shared.video && shared.video.capBytes) || 100 * GIB
  infoRow(box, 'Cache', make('span', (ca.bytes || 0) > capBytes ? 'bad' : null,
    `${fmtBytes(ca.bytes || 0)} of ${fmtBytes(capBytes)}${ca.count != null ? ` · ${ca.count} video${ca.count === 1 ? '' : 's'}` : ''}`))

  capBox.hidden = false
  const input = $('#vidCapInput')
  if (input && document.activeElement !== input) input.value = String(Math.round(capBytes / GIB * 10) / 10)
}

function paintVideoFavorites() {
  const box = $('#vidFavs')
  if (!box) return
  const f = vid.favorites
  const names = !f || f.error ? null
    : (Array.isArray(f.data) ? f.data : [])
      .map((x) => (typeof x === 'string' ? x : (x && (x.title || x.name)) || ''))
      .filter(Boolean)
  const prefs = (shared.video && shared.video.favorites) || {}
  const sig = JSON.stringify([f ? (f.error || names) : null, prefs])
  if (sig === vidFavSig || inField(box)) return
  vidFavSig = sig
  box.innerHTML = ''
  box.appendChild(make('h3', null, 'Sonos favorites'))
  if (!f) { box.appendChild(make('p', 'empty-note', 'Loading…')); return }
  if (f.error) { box.appendChild(make('p', 'err-line', `Could not read the Sonos favorites: ${f.error}`)); return }
  if (!names.length) { box.appendChild(make('p', 'empty-note', 'No Sonos favorites found.')); return }
  for (const name of names) {
    const sel = select([['yes', 'Yes'], ['no', 'No']], prefs[name] === 'no' ? 'no' : 'yes', async (v) => {
      try {
        // The hub deep-merges, so only this favorite goes over the wire.
        const merged = await patchShared({ video: { favorites: { [name]: v } } })
        if (merged && typeof merged === 'object') shared = merged
      } catch (e) { toast(`Not saved: ${e.message || e}`) }
    })
    row(box, favLabel(name), '', sel)
  }
}

// Collection rows, newest play first.
function paintVideoCollection() {
  const box = $('#vidColl')
  if (!box) return
  const h = vid.health && vid.health.data
  if (h && !h.configured) { box.hidden = true; return }
  box.hidden = false
  const c = vid.collection
  const entries = c && c.data && Array.isArray(c.data.entries) ? c.data.entries.slice() : []
  entries.sort((a, b) => (seenTime(b.lastPlayedAt) ?? -1) - (seenTime(a.lastPlayedAt) ?? -1))
  const sig = JSON.stringify([c ? (c.error || entries) : null, [...vidPickOpen].sort()])
  if (sig === vidCollSig || inField(box)) return
  vidCollSig = sig
  box.innerHTML = ''
  const title = make('h3', null, 'Collection')
  if (c && c.data) title.appendChild(make('small', null, `${entries.length} song${entries.length === 1 ? '' : 's'}, most recently played first`))
  box.appendChild(title)
  if (!c) { box.appendChild(make('p', 'empty-note', 'Loading…')); return }
  if (c.error) { box.appendChild(make('p', 'err-line', `Could not read /api/video/collection: ${c.error}`)); return }
  if (!entries.length) box.appendChild(make('p', 'empty-note', 'Nothing matched yet. Play something with Music Videos on.'))
  const list = make('div', 'vid-list')
  for (const e of entries) list.appendChild(videoRow(e))
  box.appendChild(list)

  const bar = make('div', 'toolbar')
  const clear = make('button', 'danger', 'Clear cache')
  clear.onclick = () => videoAction(clear, '/api/video/clear', {},
    'Delete every cached video? Hand-picked files are kept.', (r) => `Cleared${r && r.removed != null ? `: ${r.removed} file${r.removed === 1 ? '' : 's'}` : ''}`)
  bar.append(clear, make('span', 'note', 'Hand-picked files are untouched.'))
  box.appendChild(bar)
}

function videoRow(e) {
  const key = String(e.key || '')
  const r = make('div', 'vid-row')

  const thumb = make('div', 'vid-thumb')
  if (!(e.status === 'none' && !e.thumb)) {
    const img = document.createElement('img')
    img.alt = ''
    img.loading = 'lazy'
    img.onerror = () => { img.hidden = true }
    img.src = `/api/video/thumb/${encodeURIComponent(key)}`
    thumb.appendChild(img)
  }
  r.appendChild(thumb)

  const info = make('div', 'vid-info')
  const head = make('div', 'vid-title', `${e.artist || '?'} - ${e.title || key}`)
  if (e.pinned) head.appendChild(make('span', 'vid-pin', 'pinned'))
  info.appendChild(head)
  let match
  if (e.status === 'none') match = make('div', 'muted', 'no video')
  else if (e.source === 'override') match = make('div', 'muted', 'override')
  else match = make('div', 'muted', [e.videoTitle, e.channel].filter(Boolean).join(' · ') || 'matched')
  info.appendChild(match)
  const meta = make('div', 'vid-meta')
  meta.append(
    document.createTextNode(`${e.source === 'override' || e.status === 'none' ? '' : fmtBytes(e.bytes || 0) + ' · '}` +
      `${e.plays || 0} play${e.plays === 1 ? '' : 's'} · last played `),
    e.lastPlayedAt ? ageSpan(isoOf(e.lastPlayedAt), 'never') : make('span', null, 'never'))
  info.appendChild(meta)

  if (vidPickOpen.has(key)) {
    const pick = make('div', 'vid-pick')
    const input = document.createElement('input')
    input.type = 'text'
    input.placeholder = 'YouTube link or video id'
    input.value = vidPickText.get(key) || ''
    input.oninput = () => vidPickText.set(key, input.value)
    const save = make('button', 'action', 'Save')
    const go = () => {
      const url = input.value.trim()
      if (!url) { toast('Paste a YouTube link first'); return }
      videoAction(save, '/api/video/pick', { key, url }, null,
        (res) => `Picked${res && res.video && res.video.videoTitle ? `: ${res.video.videoTitle}` : ''}`,
        () => { vidPickOpen.delete(key); vidPickText.delete(key) })
    }
    save.onclick = go
    input.onkeydown = (ev) => { if (ev.key === 'Enter') go() }
    const cancel = make('button', 'ghost', 'Cancel')
    cancel.onclick = () => { vidPickOpen.delete(key); vidPickText.delete(key); vidCollSig = null; paintVideoCollection() }
    pick.append(input, save, cancel)
    info.appendChild(pick)
  }
  r.appendChild(info)

  const acts = make('div', 'vid-actions')
  const rematch = make('button', 'ghost', 'Re-match')
  rematch.onclick = () => videoAction(rematch, '/api/video/wrong', { key }, null,
    (res) => `Re-matched${res && res.video ? `: ${res.video.videoTitle || res.video.status || 'done'}` : ''}`)
  const pickBtn = make('button', 'ghost', 'Pick…')
  pickBtn.onclick = () => {
    if (vidPickOpen.has(key)) vidPickOpen.delete(key); else vidPickOpen.add(key)
    vidCollSig = null; paintVideoCollection()
    const mine = [...document.querySelectorAll('.vid-row')].find((x) => x.dataset.key === key)
    const inp = mine && mine.querySelector('.vid-pick input')
    if (inp) inp.focus()
  }
  const del = make('button', 'danger', 'Delete')
  del.onclick = () => videoAction(del, '/api/video/delete', { key },
    `Remove "${e.artist || ''} - ${e.title || key}" from the collection?`, () => 'Deleted')
  acts.append(rematch, pickBtn, del)
  r.appendChild(acts)
  r.dataset.key = key
  return r
}

// POST a collection action, then look again right away. confirmText (if any) is
// asked first; text(result) is the toast; done() runs after a success.
async function videoAction(btn, path, body, confirmText, text, done) {
  if (confirmText && !confirm(confirmText)) return
  btn.disabled = true
  const label = btn.textContent
  if (path.endsWith('/pick')) btn.textContent = 'Saving…'
  try {
    const res = await api(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    })
    if (res && res.ok === false) throw new Error(res.error || 'the hub said no')
    if (done) done()
    toast(text(res))
  } catch (e) {
    toast(`Failed: ${String(e.message || e)}`)
  }
  btn.disabled = false
  btn.textContent = label
  vidCollSig = null
  await loadVideo(true)
}

// The read-only house-wide status. Fetched when the House-wide pane opens and
// every minute while it is open, then painted in place (paintExtras): it never
// rebuilds the calendar table, so it cannot disturb an edit.
const EXTRAS_MS = 60 * 1000
const CAL_STALE_MS = 20 * 60 * 1000     // the hub refetches Google every 5 min
const ART_STALE_MS = 3 * 60 * 60 * 1000 // and syncs the album hourly
const WEATHER_STALE_MS = 45 * 60 * 1000 // and refreshes the weather feed every 15 min
let extras = { calendar: null, state: null, art: null, weather: null, ha: null, haLog: null, at: 0 }
let extrasJob = null

function loadExtras(force) {
  if (extrasJob) return force ? extrasJob.then(() => loadExtras(true)) : extrasJob
  if (!force && Date.now() - extras.at < EXTRAS_MS) return Promise.resolve()
  // Each source fails on its own: a hub without /api/calendar still shows its
  // headline and art (and one without Home Assistant configured still shows
  // everything else).
  const get = (path) => api(path).then((data) => ({ data }), (e) => ({ error: String(e.message || e) }))
  extrasJob = Promise.all([
    get('/api/calendar?days=3'), get('/api/state'), get('/api/countdown-art'),
    get('/api/weather'), get('/api/ha/state'), get('/api/ha/actions/log?limit=20'),
  ])
    .then(([calendar, state, art, weather, ha, haLog]) => {
      extras = { calendar, state, art, weather, ha, haLog, at: Date.now() }
      paintExtras()
    })
    .catch((e) => console.error('house-wide status', e))
    .finally(() => { extrasJob = null })
  return extrasJob
}

function paintExtras() {
  const status = $('#calStatus')
  if (status) paintCalendarStatus(status)
  const art = $('#artBody')
  if (art) paintArt(art)
  const weather = $('#weatherStatus')
  if (weather) paintWeatherStatus(weather)
  const haStatus = $('#haStatus')
  if (haStatus) paintHaStatus(haStatus)
  const haLog = $('#haLog')
  if (haLog) paintHaLog(haLog)
  updateAges()
}

function paintCalendarStatus(box) {
  box.innerHTML = ''
  const { calendar, state } = extras
  if (!calendar) {
    infoRow(box, 'Calendar', make('span', 'muted', 'Loading…'))
  } else if (calendar.error) {
    infoRow(box, 'Calendar', make('span', 'bad', `Could not read /api/calendar: ${calendar.error}`))
  } else {
    const c = calendar.data || {}
    // The address to share each calendar with (read-only, "See all event
    // details"). Null until the key file is on the hub.
    if (c.serviceAccount) infoRow(box, 'Share calendars with', make('code', null, String(c.serviceAccount)))
    infoRow(box, 'Connected', make('span', c.connected ? 'ok' : 'bad', c.connected ? 'Yes' : 'No'))
    // Per-calendar health, so "Sheena's is not shared yet" is one glance.
    if (Array.isArray(c.calendars) && c.calendars.length) {
      const wrap = make('div', null)
      for (const cal of c.calendars) {
        const line = make('div', null)
        line.appendChild(make('span', cal.ok ? 'ok' : 'bad', cal.ok ? 'ok' : 'failing'))
        line.appendChild(document.createTextNode(` ${cal.label || cal.id}: ${cal.ok ? `${cal.events ?? 0} event(s)` : (cal.error || 'no answer')}`))
        wrap.appendChild(line)
      }
      infoRow(box, 'Per calendar', wrap)
    }
    infoRow(box, 'Last fetch', ageSpan(c.fetchedAt, 'never', CAL_STALE_MS))
    infoRow(box, `Events, next ${c.days ?? 3} days`,
      make('span', null, String(Array.isArray(c.events) ? c.events.length : 0)))
    if (c.error) infoRow(box, 'Error', make('span', 'bad', String(c.error)))
    infoRow(box, 'Countdowns', countdownList(c.countdowns))
  }
  const hl = state && state.data && state.data.headline
  infoRow(box, 'Headline now',
    !state ? make('span', 'muted', 'Loading…')
      : state.error ? make('span', 'bad', `Could not read /api/state: ${state.error}`)
      : hl && hl.text ? headlineLine(hl)
      : make('span', 'muted', 'None (this hub does not send a headline yet)'))
}

// GET /api/weather (docs/designs/panels-and-controls.md, "One weather feed"):
// { source, fetchedAt, error, attribution: null | { name, url }, ... }.
const WEATHER_SOURCE_LABEL = { weatherkit: 'Apple WeatherKit', 'open-meteo': 'Open-Meteo' }
function paintWeatherStatus(box) {
  box.innerHTML = ''
  const { weather } = extras
  if (!weather) {
    infoRow(box, 'Weather', make('span', 'muted', 'Loading…'))
    return
  }
  if (weather.error) {
    infoRow(box, 'Weather', make('span', 'bad', `Could not read /api/weather: ${weather.error}`))
    return
  }
  const w = weather.data || {}
  const label = WEATHER_SOURCE_LABEL[w.source] || w.source || 'unknown'
  infoRow(box, 'Source', make('span', null, label))
  infoRow(box, 'Fetched', ageSpan(w.fetchedAt, 'never', WEATHER_STALE_MS))
  if (w.error) infoRow(box, 'Error', make('span', 'bad', String(w.error)))
  if (w.attribution && w.attribution.url) {
    const link = document.createElement('a')
    link.href = w.attribution.url
    link.target = '_blank'
    link.rel = 'noopener'
    link.textContent = w.attribution.name || 'Apple Weather'
    infoRow(box, 'Attribution', link)
  }
}

function countdownList(list) {
  const box = make('div', 'cd-list')
  if (!Array.isArray(list) || !list.length) {
    box.appendChild(make('span', 'muted', 'None right now. Write "countdown" in an event\'s description to add one.'))
    return box
  }
  const names = new Map(artView().items.map((a) => [String(a.file), a.name]))
  for (const cd of list) {
    const item = make('div', 'cd')
    const thumb = make('div', 'cd-thumb')
    let art = 'no art'
    if (typeof cd.image === 'string' && cd.image) {
      const img = document.createElement('img')
      img.src = cd.image; img.alt = ''; img.decoding = 'async'
      thumb.appendChild(img)
      const file = fileOf(cd.image)
      art = `art: ${names.get(file) || file}`
    } else {
      // What the board falls back to: the title's emoji, else a calendar glyph.
      thumb.textContent = cd.emoji || '\u{1F4C5}'
      if (cd.emoji) art = `no art, shows ${cd.emoji}`
    }
    const title = make('div', 'cd-title')
    if (cd.color) {
      const dot = make('span', 'dot')
      dot.style.background = cd.color
      if (cd.calendarLabel) dot.title = cd.calendarLabel
      title.appendChild(dot)
    }
    title.appendChild(document.createTextNode(cd.title || '(untitled)'))
    const meta = make('div', 'cd-meta',
      [fmtDay(cd.date), daysLeftText(cd.daysLeft), art].filter(Boolean).join(' · '))
    const text = make('div')
    text.append(title, meta)
    item.append(thumb, text)
    box.appendChild(item)
  }
  return box
}

function fileOf(path) {
  const last = String(path).split('?')[0].split('/').pop()
  try { return decodeURIComponent(last) } catch { return last }
}

function fmtDay(key) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ''))
  if (!m) return key || ''
  return new Date(+m[1], +m[2] - 1, +m[3])
    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
}

const daysLeftText = (n) => (typeof n !== 'number' ? ''
  : n <= 0 ? 'today' : n === 1 ? '1 day left' : `${n} days left`)

// headline.kind, from frameserver/lib/headline.mjs.
const HEADLINE_KINDS = {
  now: 'an event is on now', soon: 'starts within the hour', next: 'next event today',
  today: 'all-day event today', tomorrow: 'first thing tomorrow', daypart: 'nothing on, time-of-day line',
  alert: 'National Weather Service alert', weather: 'forecast line',
}
function headlineLine(hl) {
  const e = make('span', null, hl.text)
  if (hl.kind) {
    const gloss = HEADLINE_KINDS[hl.kind]
    e.appendChild(make('span', 'muted', ` · ${hl.kind}${gloss ? ` (${gloss})` : ''}`))
  }
  return e
}

function paintArt(box) {
  box.innerHTML = ''
  const meta = $('#artMeta')
  if (meta) meta.textContent = ''
  const a = extras.art
  if (!a) return box.appendChild(make('p', 'empty-note', 'Loading…'))
  if (a.error) return box.appendChild(make('p', 'err-line', `Could not read /api/countdown-art: ${a.error}`))
  const v = artView()
  const n = v.items.length
  if (meta) {
    // The album's name once the hub has found it (or evidently has: it has art).
    const name = v.album || (n || v.albumId ? 'Countdown Art' : null)
    meta.append(name ? `Album "${name}"` : 'No album found')
    if (v.syncedAt) meta.append(name ? ' · synced ' : ' · last synced ', ageSpan(v.syncedAt, 'never', ART_STALE_MS))
    else meta.append(' · not synced yet')
    if (name) meta.append(` · ${n} image${n === 1 ? '' : 's'}`)
    if (v.running) meta.append(' · syncing now')
  }
  // The hub reports a missing album as an error; the empty state says that
  // better. Any other error (Immich not configured or unreachable) shows as
  // it is, without guessing that the album is missing.
  const noAlbum = !n && !v.albumId && (!v.error || /no immich album/i.test(v.error))
  if (v.error && !noAlbum) box.appendChild(make('p', 'err-line', v.error))
  if (!n) {
    if (noAlbum) box.appendChild(make('p', 'art-empty', 'No album named Countdown Art in Immich yet.'))
    else if (v.albumId && !v.error) box.appendChild(make('p', 'art-empty', 'The Countdown Art album has no images yet.'))
    box.appendChild(make('p', 'empty-note', (noAlbum ? 'Make one and add' : 'Add') +
      " PNGs with transparent backgrounds; each file's name and Immich description are its keywords."))
    return
  }
  const grid = make('div', 'art-grid')
  for (const it of v.items) {
    const tile = make('div', 'art-tile')
    const pic = make('div', 'art-pic')
    const img = document.createElement('img')
    img.src = artSrc(it.file); img.alt = it.name || ''; img.loading = 'lazy'; img.decoding = 'async'
    pic.appendChild(img)
    const kw = Array.isArray(it.keywords) ? it.keywords.join(', ') : ''
    tile.append(pic, make('div', 'art-name', it.name || it.file || '?'), make('div', 'art-kw', kw || 'no keywords'))
    grid.appendChild(tile)
  }
  box.appendChild(grid)
}

// ==== health: the Power line and Power events ================================
// Each screen that runs a server of its own (the kitchen Pi, pi/kiosk-server.py)
// POSTs a heartbeat every minute: the firmware's throttle flags, temperature,
// uptime, the build it serves. The hub keeps the latest and logs power events
// (frameserver/lib/health.mjs). A Screen card shows a Power line once its
// screen reports, and the events sit under the screen list. Both are
// read-only and repainted in place from updateAges, so they never disturb an
// edit and keep aging when the hub stops answering.

// [label, now flag, since-boot flag]; the first one set names the state.
const POWER_FLAGS = [
  ['Undervoltage', 'underVoltageNow', 'underVoltageOccurred'],
  ['Throttled', 'throttledNow', 'throttledOccurred'],
  ['CPU frequency capped', 'armFreqCappedNow', 'armFreqCappedOccurred'],
  ['Temperature limit', 'softTempLimitNow', 'softTempLimitOccurred'],
]
const POWER_KINDS = { undervoltage: 'undervoltage', throttled: 'throttled', freq: 'frequency capped', temp: 'temperature limit' }
const POWER_EVENTS_MS = 30 * 1000
let powerEvents = null // GET /api/health/events, newest first; null = none to show

// "40 s", "12 min", "3 h", "2 d": how long something has lasted.
function spanText(ms) {
  const s = Math.max(0, Math.floor(ms / 1000))
  if (s < 60) return `${s} s`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m} min`
  const h = Math.floor(m / 60)
  return h < 48 ? `${h} h` : `${Math.floor(h / 24)} d`
}

// Uptime: "12 min", "5 h 12 min", "2 d 15 h".
function upText(sec) {
  const m = Math.floor(sec / 60)
  const h = Math.floor(m / 60)
  if (h < 1) return `${m} min`
  return h < 24 ? `${h} h ${m % 60} min` : `${Math.floor(h / 24)} d ${h % 24} h`
}

// An event's time: "7:12 AM" today, "Sep 22, 8:34 AM" before.
function clockText(iso) {
  const d = new Date(iso)
  if (!Number.isFinite(d.getTime())) return ''
  const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })
  return d.toDateString() === new Date().toDateString()
    ? time : `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, ${time}`
}

function powerEventsText(h) {
  const n = h.events24h || 0
  if (n > 0) return `${n} event${n === 1 ? '' : 's'} in 24 h, last ${clockText(h.lastEvent.at)}`
  return h.lastEvent ? `no events in 24 h, last ${clockText(h.lastEvent.at)}` : ''
}

// A screen's health -> { cls, text, detail: [], raw, meta: [] }.
function powerView(h) {
  const L = h.latest
  const got = seenTime(h.receivedAt)
  const age = got == null ? null : Math.max(0, Date.now() - got)
  const stale = !L || age == null || age > (h.staleAfterS || 180) * 1000
  const flags = L && L.throttled
  const now = flags && POWER_FLAGS.find(([, n]) => flags[n])
  const since = flags && POWER_FLAGS.find(([, , o]) => flags[o])
  const state = !flags ? ['pw-grey', 'No throttle reading']
    : now ? ['pw-red', `${now[0]} now`]
    : since ? ['pw-amber', `${since[0]} since boot`]
    : ['pw-ok', 'Power OK']
  const v = { cls: state[0], text: state[1], detail: [], raw: null, meta: [] }
  // The kernel's own count: every dip, where get_throttled only says "since boot".
  if (L && L.underVoltageDips > 0) {
    const n = L.underVoltageDips
    const last = typeof L.lastDipAgoS === 'number' && got != null ? `, last ${agoText(got - L.lastDipAgoS * 1000)}` : ''
    v.detail.push(`${n} dip${n === 1 ? '' : 's'} this boot${last}`)
  }
  const ev = powerEventsText(h)
  if (ev && (now || since || h.events24h > 0)) v.detail.push(ev)
  if (now || since) v.raw = flags.raw
  if (stale) {
    v.detail = [L && `last report: ${state[1][0].toLowerCase()}${state[1].slice(1)}`, ev].filter(Boolean)
    v.raw = null
    v.cls = 'pw-grey'
    const started = seenTime(h.hubStartedAt)
    v.text = L ? `No heartbeat for ${spanText(age)}`
      : `No heartbeat since the hub started${started == null ? '' : `, ${agoText(started)}`}`
  }
  if (L) {
    if (typeof L.tempC === 'number') v.meta.push(`${Math.round(L.tempC)} °C`)
    if (typeof L.uptimeS === 'number') {
      v.meta.push(stale ? `was up ${upText(L.uptimeS)}` : `up ${upText(L.uptimeS + Math.floor(age / 1000))}`)
    }
    if (!stale) v.meta.push(`heartbeat ${agoText(got)}`)
    if (L.build) v.meta.push(`build ${L.build}`)
  }
  return v
}

function powerRow(dev) {
  const r = make('div', 'row info power-row')
  const v = make('div', 'v')
  v.dataset.powerId = dev.id
  r.append(make('div', 'k', 'Power'), v)
  return r
}

function paintPowerLine(el, h) {
  el.innerHTML = ''
  if (!h) return el.appendChild(make('span', 'muted', 'No heartbeat'))
  const v = powerView(h)
  const line = make('div', `power-state ${v.cls}`)
  line.append(make('span', 'dot'), v.text)
  if (v.detail.length || v.raw) {
    const d = make('span', 'power-detail', v.detail.length ? ` · ${v.detail.join(' · ')}` : '')
    if (v.raw) d.append(' · ', make('code', null, v.raw))
    line.appendChild(d)
  }
  const L = h.latest
  if (L) line.title = [L.model, L.kernel && `kernel ${L.kernel}`, L.throttled && `throttled=${L.throttled.raw}`]
    .filter(Boolean).join(' · ')
  el.appendChild(line)
  if (v.meta.length) el.appendChild(make('div', 'power-meta', v.meta.join(' · ')))
}

function paintPowerEvents() {
  const box = $('#powerEvents')
  if (!box) return
  // Shown once any screen reports, or there is history to show.
  box.hidden = powerEvents == null || (!powerEvents.length && !devices.some((d) => d.health))
  if (box.hidden) return
  box.innerHTML = ''
  const head = make('h2', null, 'Power events')
  head.appendChild(make('small', null, 'newest 10'))
  box.appendChild(head)
  if (!powerEvents.length) return box.appendChild(make('p', 'pe-none', 'None logged.'))
  const table = make('table')
  const body = make('tbody')
  for (const e of powerEvents) {
    const tr = make('tr')
    tr.title = [e.at, typeof e.tempC === 'number' ? `${e.tempC} °C` : '',
      typeof e.uptimeS === 'number' ? `up ${upText(e.uptimeS)}` : ''].filter(Boolean).join(' · ')
    const dev = devices.find((d) => d.id === e.id)
    const when = make('td')
    when.append(make('div', 'when', clockText(e.at)), make('div', 'dev', (dev && dev.name) || e.id))
    const what = make('td')
    what.append(make('div', `kind ${e.now ? 'pw-red' : 'pw-amber'}`, `${POWER_KINDS[e.kind] || e.kind}${e.now ? ', now' : ''}`),
      make('code', null, e.raw || ''))
    tr.append(when, what)
    body.appendChild(tr)
  }
  table.appendChild(body)
  box.appendChild(table)
}

function paintPower() {
  for (const el of document.querySelectorAll('[data-power-id]')) {
    const dev = devices.find((d) => d.id === el.dataset.powerId)
    paintPowerLine(el, dev && dev.health)
  }
  paintPowerEvents()
}

// A hub without the route (not deployed yet) answers 404: no panel.
async function loadPowerEvents() {
  try {
    const list = await api('/api/health/events?limit=10')
    powerEvents = Array.isArray(list) ? list : null
  } catch {
    powerEvents = null
  }
  paintPowerEvents()
}
loadPowerEvents()
setInterval(() => { if (!document.hidden) loadPowerEvents() }, POWER_EVENTS_MS)
// ==== /health ==================================================================

$('#refreshBtn').onclick = async () => {
  const b = $('#refreshBtn')
  b.disabled = true; b.textContent = 'Rebuilding…'
  try {
    await api('/api/photos/refresh', { method: 'POST' })
    const poll = setInterval(async () => {
      const s = await api('/api/photos/refresh/status')
      if (!s.running) {
        clearInterval(poll)
        b.disabled = false; b.textContent = 'Rebuild photos'
        toast(s.ok === false ? `Build failed: ${s.error || ''}` : `Rebuilt — ${s.photoCount ?? '?'} photos`)
        loadAll()
      }
    }, 3000)
  } catch (e) {
    b.disabled = false; b.textContent = 'Rebuild photos'
    toast(String(e.message || e))
  }
}

loadAll().catch((e) => { $('#stat').textContent = 'error: ' + e.message })
// Every 10s: fresh lastSeenAt for the ages; every third tick the full reload
// that also picks up new screens, albums and the photo count. Neither
// re-renders under an edit in progress (applyDevices), and a failed fetch
// still ages what is on screen.
let refreshTick = 0
setInterval(() => {
  refreshTick += 1
  const job = refreshTick % 3 === 0 ? loadAll({ background: true }) : loadDevices()
  job.catch(() => updateAges())
}, 10000)
// The house-wide status every minute while that pane is open (loadExtras).
setInterval(() => {
  if (selected === '__shared__' && !document.hidden) loadExtras(true)
}, EXTRAS_MS)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && selected === '__shared__') { loadExtras(); loadVideo() }
})
// Music videos: health every 30 s, the collection and favorites every 60 s,
// while the House-wide pane is open.
setInterval(() => {
  if (selected === '__shared__' && !document.hidden && $('#vidStatus')) loadVideoHealth()
}, VIDEO_HEALTH_MS)
setInterval(() => {
  if (selected === '__shared__' && !document.hidden && $('#vidStatus')) loadVideoCollection()
}, VIDEO_COLLECTION_MS)
</script>
