<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrameServer</title>
<style>
  /* Desktop-first on purpose. The kiosk app is styled in viewport units for a
     fixed panel; this needs to behave in a resizable browser window instead, so
     it uses rem and a plain grid. Phone is a deliberate fast-follow. */
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1c1c1a; --muted: #6b6b66;
    --line: #e2e2dd; --accent: #3f6f4f; --accent-ink: #fff; --warn: #9a4a2f;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e9e9e6; --muted: #9a9a94;
      --line: #2e3138; --accent: #6f9d7c; --accent-ink: #10120f; --warn: #d98b6a;
    }
  }
  * { box-sizing: border-box; }
  /* Lets native controls - the time picker's clock and popover, checkbox
     glyphs, focus rings - follow the theme instead of forcing a light widget
     onto a dark page. */
  :root { color-scheme: light dark; accent-color: var(--accent); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .9rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .01em; }
  header .stat { color: var(--muted); font-size: .85rem; }
  header .spacer { flex: 1; }
  .layout {
    display: grid; grid-template-columns: 230px 1fr; gap: 1.25rem;
    padding: 1.25rem;
    padding-left: max(1.25rem, env(safe-area-inset-left));
    padding-right: max(1.25rem, env(safe-area-inset-right));
    padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    align-items: start;
  }
  nav { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  nav button {
    display: block; width: 100%; text-align: left; padding: .7rem .9rem;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; cursor: pointer;
  }
  nav button:last-child { border-bottom: 0; }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
  nav .kind { display: block; font-size: .75rem; opacity: .7; }
  section.card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem;
  }
  section.card > h2 { margin: 0 0 .25rem; font-size: .95rem; }
  section.card > p.hint { margin: 0 0 1rem; color: var(--muted); font-size: .85rem; }
  .row {
    display: grid; grid-template-columns: 220px 1fr; gap: 1rem;
    align-items: center; padding: .55rem 0; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: 0; }
  .row label { font-size: .9rem; }
  .row label small { display: block; color: var(--muted); font-size: .78rem; font-weight: 400; }
  /* input[type=time] must be listed explicitly - it does not inherit these and
     falls back to a white browser default, which is invisible in dark mode. */
  input[type=number], input[type=text], input[type=time], select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .5rem; font: inherit; min-width: 8rem;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button.action {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 6px; padding: .45rem .8rem; font: inherit; cursor: pointer;
  }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
  button.danger { background: none; border: 1px solid var(--warn); color: var(--warn); }
  button:disabled { opacity: .5; cursor: default; }
  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .35rem .9rem; }
  .albums label { display: flex; gap: .5rem; align-items: baseline; font-size: .88rem; }
  .albums .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
  .pct { display: flex; align-items: center; gap: .75rem; }
  .pct input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .pct-val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.2rem; text-align: right; }
  .toolbar-label { align-self: center; color: var(--muted, #666); font-size: 14px; margin-right: 4px; }
.toolbar { display: flex; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; align-items: center; }
  .toolbar .note { color: var(--muted); font-size: .82rem; }
  #toast {
    position: fixed; right: 1rem; bottom: 1rem; background: var(--ink); color: var(--bg);
    padding: .5rem .8rem; border-radius: 6px; font-size: .85rem; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: .95; }
  code { font-size: .82rem; color: var(--muted); }
  /* "seen 12 s ago": when each screen last polled the hub. Warn-coloured once
     it is overdue, which is the quickest way to spot a screen that is down. */
  .seen { font-variant-numeric: tabular-nums; }
  .seen.stale { color: var(--warn); }
  section.card > h2 .seen { margin-left: .6rem; font-size: .8rem; font-weight: 400; color: var(--muted); }
  section.card > h2 .seen.stale { color: var(--warn); }
  nav button[aria-current="true"] .seen.stale { color: inherit; }
  [hidden] { display: none !important; }

  /* Colour and range inputs need explicit theming as well: without it a
     colour input is a light system button on the dark page. */
  input[type=color] {
    inline-size: 2.6rem; block-size: 2.1rem; padding: 2px; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 4px; }
  input[type=range] { accent-color: var(--accent); }
  input::placeholder { color: var(--muted); opacity: .8; }

  /* Calendars: the header and every row share one grid so the columns line
     up (rows are display: contents). On a phone each calendar is a block. */
  .cal-table {
    display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) auto auto;
    gap: .5rem .6rem; align-items: center; margin-bottom: .8rem;
  }
  .cal-head, .cal-row { display: contents; }
  .cal-head span { color: var(--muted); font-size: .78rem; }
  .cal-row input[type=text] { min-width: 0; width: 100%; }
  .cal-row .draft-note { grid-column: 1 / -1; margin-top: -.3rem; color: var(--muted); font-size: .78rem; }
  .empty-note { color: var(--muted); font-size: .88rem; margin: 0 0 .8rem; }

  /* Read-only status under the editable rows. Repainted in place every
     minute and it never holds a control, so it cannot disturb an edit. */
  .status-block { margin-top: .5rem; padding-top: .8rem; border-top: 1px solid var(--line); }
  .status-block > h3 { margin: 0 0 .1rem; font-size: .85rem; }
  .status-block > h3 small { margin-left: .5rem; color: var(--muted); font-size: .78rem; font-weight: 400; }
  .row.info { align-items: start; }
  .row > .k { font-size: .9rem; }
  .row > .v { font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
  .ok { color: var(--accent); }
  .bad { color: var(--warn); }
  .muted { color: var(--muted); }
  [data-age-at].stale { color: var(--warn); }
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .45rem; }
  .cd-list { display: grid; gap: .6rem; }
  .cd { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: .7rem; align-items: center; }
  .cd-title { font-weight: 600; }
  .cd-meta { color: var(--muted); font-size: .8rem; }

  /* Countdown art is transparent PNGs, so every tile is dark like the board
     it lands on, in either theme. */
  .art-pic, .cd-thumb {
    position: relative; aspect-ratio: 1; overflow: hidden;
    background: #16171a; border: 1px solid var(--line); border-radius: 8px;
  }
  .art-pic img, .cd-thumb img { position: absolute; inset: 10%; width: 80%; height: 80%; object-fit: contain; }
  .cd-thumb { display: grid; place-items: center; border-radius: 6px; font-size: 1.2rem; }
  .art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem .9rem; }
  .art-tile { min-width: 0; }
  .art-name { margin-top: .4rem; font-size: .88rem; font-weight: 600; overflow-wrap: anywhere; }
  .art-kw { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
  .art-empty { margin: .2rem 0 .35rem; }
  .err-line { color: var(--warn); font-size: .88rem; margin: 0 0 .8rem; overflow-wrap: anywhere; }

  /* ---- Narrow screens -------------------------------------------------
     Two breakpoints on purpose. A tablet in portrait (~768px) still has room
     for the label/control split, so only the sidebar needs to move; a phone
     does not, so rows stack there. */

  /* Tablet and below: the sidebar becomes a horizontal strip of pills so the
     content starts near the top instead of below a stacked device list. */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: .9rem; }
    nav {
      display: flex; gap: .5rem; overflow-x: auto; padding: .5rem;
      border-radius: var(--radius); -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      width: auto; flex: 0 0 auto; border: 1px solid var(--line);
      border-radius: 999px; padding: .5rem .85rem; white-space: nowrap;
    }
    nav button:last-child { border: 1px solid var(--line); }
    nav .kind { display: none; }   /* the name alone is enough in a pill */
  }

  /* Phone: stack every row. A 220px label column leaves ~150px for the
     control at 390px wide, which is unusable. */
  @media (max-width: 620px) {
    body { font-size: 16px; }      /* keeps iOS from zooming on input focus */
    /* One line, not two. The header is sticky, so every extra line permanently
       covers content on a short screen. */
    header {
      padding: .6rem 1rem; padding-top: max(.6rem, env(safe-area-inset-top));
      flex-wrap: nowrap; gap: .5rem;
    }
    header h1 { font-size: .95rem; flex: 0 0 auto; }
    header .stat { font-size: .8rem; white-space: nowrap; }
    #statScreens { display: none; }          /* the screen count is in the nav pills */
    #refreshBtn { flex: 0 0 auto; padding: .4rem .7rem; font-size: .85rem; }
    .layout { padding: .9rem; padding-bottom: max(.9rem, env(safe-area-inset-bottom)); }
    section.card { padding: .9rem 1rem; margin-bottom: .9rem; }
    .row { grid-template-columns: 1fr; gap: .4rem; padding: .8rem 0; }
    .row label small { margin-top: .1rem; }
    /* Full-width, finger-sized controls. */
    .row select, .row input[type=number], .row input[type=text], .row input[type=time] {
      width: 100%; min-width: 0; min-height: 44px; font-size: 16px;
    }
    .pct input[type=range] { min-height: 44px; }
    .row button { min-height: 44px; width: 100%; }
    .albums { grid-template-columns: 1fr; gap: 0; }
    .albums label { padding: .6rem .1rem; border-bottom: 1px solid var(--line); min-height: 44px; align-items: center; }
    .albums label:last-child { border-bottom: 0; }
    .albums input[type=checkbox] { width: 20px; height: 20px; flex: 0 0 auto; }
    /* The school-days picker reuses .albums; three across reads better than
       one tall column of seven. */
    .row .albums { grid-template-columns: repeat(3, 1fr); }
    .row .albums label { border-bottom: 0; }
    .toolbar { gap: .4rem; }
    .toolbar button { min-height: 44px; }
    /* Each calendar becomes a block: the ID on its own line, then label,
       colour and Remove. The column headings go; the placeholders say it. */
    .cal-table { display: block; margin-bottom: .6rem; }
    .cal-head { display: none; }
    .cal-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem;
      align-items: center; padding: .7rem 0; border-top: 1px solid var(--line);
    }
    .cal-head + .cal-row { border-top: 0; }
    .cal-row .cal-id { grid-column: 1 / -1; }
    .cal-row input[type=text] { min-height: 44px; font-size: 16px; }
    .cal-row input[type=color] { inline-size: 44px; block-size: 44px; }
    .cal-row button { min-height: 44px; }
    .cal-row .draft-note { margin-top: 0; }
    .art-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem .7rem; }
    #toast { left: 1rem; right: 1rem; bottom: max(1rem, env(safe-area-inset-bottom)); text-align: center; }
  }

  /* ==== health: the Power line and Power events ==========================
     From each screen's heartbeat (pi/kiosk-server.py -> frameserver/lib/
     health.mjs). Green: no flags. Amber: a flag has been set since boot.
     Red: a flag is set right now. Grey: the heartbeat stopped. */
  :root { --pw-amber: #8a5a00; --pw-red: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --pw-amber: #e0a33a; --pw-red: #f07b72; }
  }
  .side { display: grid; gap: 1.25rem; align-content: start; min-width: 0; }
  .power-row { margin-bottom: .6rem; }
  .power-state { font-weight: 600; }
  .power-state .dot { background: currentColor; }
  .power-detail { font-weight: 400; color: var(--muted); }
  .power-meta { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; margin-top: .15rem; }
  .pw-ok { color: var(--accent); }
  .pw-amber { color: var(--pw-amber); }
  .pw-red { color: var(--pw-red); }
  .pw-grey { color: var(--muted); }
  .pe { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .75rem .9rem; }
  .pe > h2 { margin: 0 0 .3rem; font-size: .85rem; }
  .pe > h2 small { margin-left: .4rem; color: var(--muted); font-size: .75rem; font-weight: 400; }
  .pe table { width: 100%; border-collapse: collapse; font-size: .78rem; line-height: 1.35; }
  .pe td { padding: .4rem 0; vertical-align: top; border-top: 1px solid var(--line); }
  .pe tr:first-child td { border-top: 0; }
  .pe td + td { text-align: right; padding-left: .6rem; }
  .pe .when { font-variant-numeric: tabular-nums; }
  .pe .dev { color: var(--muted); }
  .pe .kind { font-weight: 600; white-space: nowrap; }
  .pe code { font-size: .74rem; }
  .pe .pe-none { margin: 0; color: var(--muted); font-size: .8rem; }
  /* With the sidebar gone, the events move below the settings. */
  @media (max-width: 760px) {
    .side { display: contents; }
    #powerEvents { order: 1; }
  }
  /* ==== /health ========================================================== */

  /* ==== home assistant: the house-wide "Home Assistant" card =============
     frameserver/lib/homeAssistant.mjs. The entity and action whitelists are
     edited here like the calendar list above (one grid per table, header and
     rows sharing columns via display: contents); the connection status,
     per-entity state and the recent-actions log are read-only, repainted in
     place from loadExtras()'s minute tick (paintHaStatus / paintHaLog). */
  .ha-table, .ha-actions-table { display: grid; gap: .5rem .6rem; align-items: center; margin-bottom: .8rem; }
  .ha-table { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.6fr) auto auto auto; }
  .ha-actions-table { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) minmax(0, 1.3fr) auto auto; }
  .ha-head, .ha-row { display: contents; }
  .ha-head span { color: var(--muted); font-size: .78rem; }
  .ha-row input[type=text] { min-width: 0; width: 100%; }
  .ha-id { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .ha-state { font-size: .85rem; font-variant-numeric: tabular-nums; }
  h3.ha-sub { margin: 0 0 .5rem; font-size: .85rem; }
  .ha-search { position: relative; margin-bottom: 1rem; }
  .ha-search input[type=text] { width: 100%; max-width: 26rem; }
  .ha-search-results {
    margin-top: .4rem; max-width: 26rem; border: 1px solid var(--line); border-radius: 8px;
    max-height: 14rem; overflow-y: auto; background: var(--panel);
  }
  .ha-search-result {
    display: flex; align-items: center; justify-content: space-between; gap: .6rem;
    padding: .5rem .7rem; border-top: 1px solid var(--line); font-size: .85rem;
  }
  .ha-search-result:first-child { border-top: 0; }
  .ha-search-result .ha-id { flex: 1; min-width: 0; color: var(--ink); }
  .ha-log { display: grid; gap: .5rem; font-size: .82rem; }
  .ha-log-row { display: flex; flex-wrap: wrap; gap: .1rem .6rem; padding-top: .5rem; border-top: 1px solid var(--line); }
  .ha-log-row:first-child { border-top: 0; padding-top: 0; }
  .ha-log-row .when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 620px) {
    .ha-table, .ha-actions-table { display: block; }
    .ha-table .ha-head, .ha-actions-table .ha-head { display: none; }
    .ha-table .ha-row, .ha-actions-table .ha-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: .4rem .5rem;
      padding: .7rem 0; border-top: 1px solid var(--line);
    }
    .ha-table .ha-row > *:first-child, .ha-actions-table .ha-row > *:first-child { grid-column: 1 / -1; }
  }
  /* ==== /home assistant ==================================================== */

  /* ==== music videos: the collection list =================================
     paintVideoCollection / videoRow. One grid per row: thumbnail, text,
     actions; the actions drop under the text on a phone. */
  .vid-list { display: grid; margin-bottom: .6rem; }
  .vid-row {
    display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: .8rem;
    align-items: start; padding: .65rem 0; border-top: 1px solid var(--line);
  }
  .vid-row:first-child { border-top: 0; }
  .vid-thumb {
    position: relative; width: 112px; aspect-ratio: 16 / 9; overflow: hidden;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .vid-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vid-info { min-width: 0; font-size: .88rem; overflow-wrap: anywhere; }
  .vid-title { font-weight: 600; }
  .vid-pin {
    margin-left: .5rem; padding: .05rem .4rem; border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-size: .7rem; font-weight: 500; vertical-align: .08em;
  }
  .vid-meta { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .vid-pick { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .45rem; }
  .vid-pick input[type=text] { flex: 1; min-width: 12rem; }
  .vid-actions { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
  .vid-actions button, .vid-pick button { padding: .35rem .65rem; }
  @media (max-width: 620px) {
    .vid-row { grid-template-columns: 96px minmax(0, 1fr); }
    .vid-thumb { width: 96px; }
    .vid-actions { grid-column: 1 / -1; justify-content: flex-start; }
    .vid-actions button, .vid-pick button { min-height: 44px; }
    .vid-pick input[type=text] { min-height: 44px; font-size: 16px; }
  }
  /* ==== /music videos ===================================================== */
</style>
</head>
<body>
<header>
  <h1>FrameServer</h1>
  <span class="stat" id="stat">loading…</span><span class="stat" id="statScreens"></span>
  <span class="spacer"></span>
  <button class="action" id="refreshBtn">Rebuild photos</button>
</header>

<div class="layout">
  <!-- health: the screen list, and the Power events under it -->
  <div class="side">
    <nav id="nav"></nav>
    <section class="pe" id="powerEvents" aria-label="Power events" hidden></section>
  </div>
  <!-- /health -->
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s)
let devices = [], shared = {}, albums = [], selected = null
// Calendars added on this page that have no ID yet. Not stored until they do
// (a blank ID would reach the hub as a calendar to fetch), and kept here
// rather than only in the DOM so a background re-render does not drop them.
let calDrafts = []
// Calendar saves run one after another (see renderCalendars).
let calSaving = Promise.resolve()

const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show')
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800)
}

async function api(path, opts) {
  const res = await fetch(path, { cache: 'no-store', ...opts })
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`)
  return res.json()
}

// Every edit PATCHes immediately. There is no Save button on purpose: this is
// the same store the on-screen pickers write to, so a half-saved draft would be
// a second source of truth.
async function patchDevice(id, body) {
  await api(`/api/devices/${encodeURIComponent(id)}/config`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  toast('Saved — screens pick it up within 30s')
}
// Resolves to the merged shared settings the hub answers with.
async function patchShared(body) {
  const merged = await api('/api/settings/shared', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  toast('Saved — applies to every screen')
  return merged
}

async function loadAll(opts = {}) {
  const [d, a, h] = await Promise.all([
    api('/api/devices'), api('/api/albums').catch(() => ({ albums: [] })), api('/healthz'),
  ])
  albums = a.albums || []
  $('#stat').textContent = `${h.photos} photos`
  applyDevices(d, opts.background)
}

// The 10s background tick: the device list only, to keep lastSeenAt fresh.
async function loadDevices() {
  applyDevices(await api('/api/devices'), true)
}

// What the page was last rendered from, minus lastSeenAt (which moves on every
// screen poll and is patched in place by updateAges), screen (the viewport a
// screen reports for the layout editor; not shown here) and health (the Power
// line, repainted in place too; only whether a screen reports at all counts).
let renderedSig = null
function dataSig() {
  return JSON.stringify([
    devices.map(({ lastSeenAt, screen, health, ...rest }) => ({ ...rest, reports: !!health })), shared,
    albums.map((x) => [x.id, x.name, x.count]),
  ])
}

// True while a control in the main pane has focus. Re-rendering then would
// throw away the control mid-edit (typed text, an open dropdown, a drag).
function editing() {
  const a = document.activeElement
  return !!a && a !== document.body && $('#main').contains(a) &&
    /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)
}

function applyDevices(d, background) {
  devices = d.devices; shared = d.shared || {}
  $('#statScreens').textContent = `· ${devices.length} screens`
  if (!selected || (selected !== '__shared__' && !devices.find((x) => x.id === selected))) {
    selected = devices[0]?.id || '__shared__'
  }
  // A background refresh re-renders only when something besides the ages
  // changed, and never under an edit in progress: that change is picked up on
  // a later tick, once nothing has focus.
  if (background && (dataSig() === renderedSig || editing())) updateAges()
  else render()
}

function render() {
  const nav = $('#nav')
  nav.innerHTML = ''
  for (const dev of devices) {
    const b = document.createElement('button')
    const kind = kindLabel(dev.kind)
    b.innerHTML = `${escapeHtml(dev.name || dev.id)}<span class="kind">` +
      `${kind ? `${escapeHtml(kind)} · ` : ''}<span class="seen" data-seen-id="${escapeHtml(dev.id)}"></span></span>`
    b.setAttribute('aria-current', String(dev.id === selected))
    b.onclick = () => { selected = dev.id; render() }
    nav.appendChild(b)
  }
  const s = document.createElement('button')
  s.innerHTML = `House-wide<span class="kind">every screen</span>`
  s.setAttribute('aria-current', String(selected === '__shared__'))
  s.onclick = () => { selected = '__shared__'; render() }
  nav.appendChild(s)

  $('#main').innerHTML = ''
  if (selected === '__shared__') renderShared()
  else renderDevice(devices.find((d) => d.id === selected))
  updateAges()
  renderedSig = dataSig()
}

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

// Friendlier names for the kinds screens register with. Anything not listed
// shows its raw kind.
const KIND_LABELS = { 'web-echo': 'Echo Show' }
const kindLabel = (k) => KIND_LABELS[k] || k || ''

// lastSeenAt is stamped by the hub on every config poll (web screens poll every
// 10s, the Apple TV every 30s), so two minutes of silence means trouble.
const STALE_MS = 2 * 60 * 1000

// ISO string or epoch ms; null when the hub has never seen the screen.
function seenTime(v) {
  if (v == null || v === '') return null
  const t = typeof v === 'number' ? v : Date.parse(v)
  return Number.isFinite(t) ? t : null
}

// "12 s ago", "3 min ago": the screen ages and the house-wide status.
function agoText(t) {
  // Clamped: the hub's clock and this browser's can disagree by a second or two.
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000))
  if (s < 60) return `${s} s ago`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m} min ago`
  const h = Math.floor(m / 60)
  if (h < 48) return `${h} h ago`
  return `${Math.floor(h / 24)} d ago`
}

function seenText(t) {
  return t == null ? 'never seen' : `seen ${agoText(t)}`
}

// A placeholder that updateAges() fills in and keeps current.
function seenBadge(dev) {
  const el = document.createElement('span')
  el.className = 'seen'
  el.dataset.seenId = dev.id
  return el
}

// Rewrites every age on the page from the last fetched device list, without
// touching anything else, so it can run while a control has focus.
function updateAges() {
  for (const el of document.querySelectorAll('[data-seen-id]')) {
    const dev = devices.find((d) => d.id === el.dataset.seenId)
    const t = seenTime(dev && dev.lastSeenAt)
    el.textContent = seenText(t)
    el.classList.toggle('stale', t != null && Date.now() - t > STALE_MS)
  }
  // Other timestamps on the page: the calendar's last fetch, the art sync.
  for (const el of document.querySelectorAll('[data-age-at]')) {
    const t = seenTime(el.dataset.ageAt)
    el.textContent = t == null ? (el.dataset.never || 'never') : agoText(t)
    const staleMs = Number(el.dataset.staleMs) || 0
    el.classList.toggle('stale', t != null && staleMs > 0 && Date.now() - t > staleMs)
  }
  paintPower() // health: the Power lines and the Power events, in place
}

function card(title, hint) {
  const el = document.createElement('section')
  el.className = 'card'
  el.innerHTML = `<h2>${escapeHtml(title)}</h2>` + (hint ? `<p class="hint">${escapeHtml(hint)}</p>` : '')
  $('#main').appendChild(el)
  return el
}

function row(parent, label, hint, control) {
  const r = document.createElement('div')
  r.className = 'row'
  const l = document.createElement('label')
  l.innerHTML = escapeHtml(label) + (hint ? `<small>${escapeHtml(hint)}</small>` : '')
  r.appendChild(l); r.appendChild(control); parent.appendChild(r)
  return r
}

function select(options, value, onChange) {
  const el = document.createElement('select')
  for (const [v, text] of options) {
    const o = document.createElement('option')
    o.value = String(v); o.textContent = text
    o.selected = String(v) === String(value)
    el.appendChild(o)
  }
  el.onchange = () => onChange(el.value)
  return el
}

// Brightness is stored as an arbitrary fraction (the kitchen's Settings uses a
// 5%-step slider, the TV a 5%-step stepper). A coarse <select> cannot represent
// e.g. 0.65 - the browser falls back to showing the FIRST option, so the page
// would claim 10% for a screen actually at 65% and silently overwrite it on
// touch. A range input represents any value faithfully.
function percentControl(fraction, onChange, opts = {}) {
  const wrap = document.createElement('div')
  wrap.className = 'pct'
  const el = document.createElement('input')
  el.type = 'range'
  el.min = opts.min ?? 10
  el.max = opts.max ?? 100
  el.step = 5
  el.value = Math.round(((fraction ?? 0) * 100))
  const out = document.createElement('span')
  out.className = 'pct-val'
  out.textContent = `${el.value}%`
  el.oninput = () => { out.textContent = `${el.value}%` }
  if (opts.debounceMs) {
    // Saves during a drag as well, once the thumb rests for debounceMs, rather
    // than once per 5% step. The value it lands on is always sent, once.
    let timer = null
    let sent = el.value
    const soon = () => {
      clearTimeout(timer)
      timer = setTimeout(() => {
        if (el.value === sent) return
        sent = el.value
        onChange(Number(el.value) / 100)
      }, opts.debounceMs)
    }
    el.addEventListener('input', soon)
    el.onchange = soon
    // Safari does not reliably focus a range input on click, and editing()
    // needs the focus to hold off a background re-render mid-drag.
    el.onpointerdown = () => el.focus()
  } else {
    el.onchange = () => onChange(Number(el.value) / 100)
  }
  wrap.append(el, out)
  return wrap
}

function numberInput(value, onChange, opts = {}) {
  const el = document.createElement('input')
  el.type = 'number'; el.value = value ?? ''
  if (opts.min !== undefined) el.min = opts.min
  if (opts.max !== undefined) el.max = opts.max
  if (opts.step !== undefined) el.step = opts.step
  el.onchange = () => onChange(el.value === '' ? null : Number(el.value))
  return el
}

const DURATIONS = [
  [10, '10 seconds'], [30, '30 seconds'], [60, '1 minute'], [180, '3 minutes'],
  [300, '5 minutes'], [600, '10 minutes'], [900, '15 minutes'], [1800, '30 minutes'],
  [3600, '1 hour'], [7200, '2 hours'], [10800, '3 hours'], [21600, '6 hours'],
  [43200, '12 hours'], [86400, '24 hours'],
]

function renderDevice(dev) {
  if (!dev) return
  const cfg = dev.config || {}
  const isTV = dev.kind === 'tvos'
  const isWeb = (dev.kind || '').startsWith('web')
  // The Echo has no panel of its own to drive: dimming is the CSS overlay and
  // off is the night face, so the DDC rows do not apply to it.
  const isEcho = dev.kind === 'web-echo'

  // --- screen power ---
  // Commands the APP, not the panel. Powering the panel down directly over DDC
  // would leave the app thinking it is still awake - no overlay, and touch
  // would not wake it, because the wake path only fires when the app believes
  // it is off. tvOS has no handler for this, so the card is web-only.
  {
    const p = card('Screen',
      (isTV
        ? 'The Apple TV picks a command up within about 30 seconds. '
        : 'Takes effect within about 10 seconds. Touching the screen also wakes it. ') +
      (isEcho
        ? 'Reload page restarts the app; if Silk wants a tap afterwards, the Echo shows "Tap to start". '
        : isTV ? '' : 'Reload page restarts the app on that screen. ') +
      'Show switches the view once, like tapping the menu; the morning schedule still applies afterwards.')
    p.querySelector('h2').appendChild(seenBadge(dev))
    // health: the Power line, for a screen that sends a heartbeat (paintPower).
    if (dev.health) p.appendChild(powerRow(dev))

    // One-shot commands. ts identifies the command; the device tracks the last
    // one it ran and ignores anything older than two minutes, so a reload (or
    // a TV relaunch) cannot replay it.
    const sendCommand = async (btn, command, sent) => {
      btn.disabled = true
      try {
        await api(`/api/devices/${encodeURIComponent(dev.id)}/config`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: { ...command, ts: Date.now() } }),
        })
        toast(sent)
      } catch (e) { toast(String(e.message || e)) }
      btn.disabled = false
    }

    // Power and reload are web-only: the TV's dimming is its own overlay with
    // no remote hook, and a native app has nothing to reload.
    if (!isTV) {
      const bar = document.createElement('div')
      bar.className = 'toolbar'
      for (const [action, label, sent] of [
        ['sleep', 'Turn off screen', 'Turning the screen off…'],
        ['wake', 'Wake screen', 'Waking the screen…'],
        ['reload', 'Reload page', 'Reloading the page…'],
      ]) {
        const b = document.createElement('button')
        b.className = action === 'sleep' ? 'action' : 'ghost'
        b.textContent = label
        b.onclick = () => sendCommand(b, { action }, sent)
        bar.appendChild(b)
      }
      p.appendChild(bar)
    }

    // Show: nudge the screen to a view. Every screen understands this (the
    // web app via settings.js handleHubCommand, the TV via TVSettingsHubSync).
    const show = document.createElement('div')
    show.className = 'toolbar'
    const lbl = document.createElement('span')
    lbl.className = 'toolbar-label'
    lbl.textContent = 'Show'
    show.appendChild(lbl)
    for (const [view, label] of [['photos', 'Photos'], ['today', 'Today'], ['music', 'Now Playing'],
      ...(isWeb ? [['plex', 'Plex']] : [])]) {
      const b = document.createElement('button')
      b.className = 'ghost'
      b.textContent = label
      b.onclick = () => sendCommand(b, { action: 'view', view }, `Showing ${label}…`)
      show.appendChild(b)
    }
    p.appendChild(show)

    // The layout editor (docs/designs/layout-editor.md), in a tab of its own:
    // it is a desktop tool, and the dashboard stays where it was.
    if (isWeb) {
      const ed = document.createElement('div')
      ed.className = 'toolbar'
      const b = document.createElement('button')
      b.className = 'action ghost'
      b.textContent = 'Edit layout'
      // Opens on the Today layout the screen shows when the editor edits it
      // (Entry board or Board), else on the Entry board. Read at click time:
      // the device list refreshes every 10 s, the card only when idle.
      b.onclick = () => {
        const cur = devices.find((d) => d.id === dev.id) || dev
        const lay = ((cur.config || {}).display || {}).todayLayout
        const q = lay === 'entry' || lay === 'board' ? `&layout=${lay}` : ''
        window.open(`/editor/?device=${encodeURIComponent(dev.id)}${q}`, '_blank', 'noopener')
      }
      const note = document.createElement('span')
      note.className = 'note'
      note.textContent = "Move and size this screen's Entry board or Board in a browser on your Mac."
      ed.append(b, note)
      p.appendChild(ed)
    }
  }

  // --- albums ---
  const c = card('Photo albums',
    isTV ? 'What this Apple TV shows. Independent of every other screen.'
         : 'What this screen shows. Independent of every other screen.')
  const all = (cfg.slideshow || {}).selectedAlbumIds == null
  const chosen = new Set((cfg.slideshow || {}).selectedAlbumIds || [])

  const bar = document.createElement('div')
  bar.className = 'toolbar'
  const allBtn = document.createElement('button')
  allBtn.className = 'action' + (all ? '' : ' ghost')
  allBtn.textContent = all ? 'Showing all albums' : 'Show all albums'
  allBtn.onclick = async () => {
    await patchDevice(dev.id, { slideshow: { selectedAlbumIds: null } })
    ;(dev.config.slideshow ||= {}).selectedAlbumIds = null; render()
  }
  bar.appendChild(allBtn)
  const note = document.createElement('span')
  note.className = 'note'
  note.textContent = all
    ? 'New albums added to Immich are included automatically.'
    : `${chosen.size} of ${albums.length} selected`
  bar.appendChild(note)
  c.appendChild(bar)

  const grid = document.createElement('div')
  grid.className = 'albums'
  for (const a of albums) {
    const l = document.createElement('label')
    const cb = document.createElement('input')
    cb.type = 'checkbox'
    cb.checked = all ? false : chosen.has(a.id)
    cb.onchange = async () => {
      const next = new Set(all ? [] : chosen)
      cb.checked ? next.add(a.id) : next.delete(a.id)
      const arr = [...next]
      await patchDevice(dev.id, { slideshow: { selectedAlbumIds: arr } })
      ;(dev.config.slideshow ||= {}).selectedAlbumIds = arr; render()
    }
    const span = document.createElement('span')
    span.textContent = a.name
    const cnt = document.createElement('span')
    cnt.className = 'count'
    cnt.textContent = a.count ?? ''
    l.append(cb, span, cnt)
    grid.appendChild(l)
  }
  c.appendChild(grid)

  // --- slideshow behaviour ---
  const b = card('Slideshow')
  if (isTV) {
    const tv = cfg.tv || {}
    row(b, 'Photo duration', 'How long each photo stays up',
      select(DURATIONS, tv.photoDurationSeconds,
        (v) => patchDevice(dev.id, { tv: { photoDurationSeconds: Number(v) } })))
    row(b, 'Art facts', 'Rotating fact on the mat for artworks',
      select([[true, 'On'], [false, 'Off']], tv.artFacts,
        (v) => patchDevice(dev.id, { tv: { artFacts: v === 'true' } })))
    row(b, 'Art display', 'How artworks are presented',
      select([[0, 'Shadow box'], [1, 'Fill'], [2, 'Fill + music']], tv.artDisplay,
        (v) => patchDevice(dev.id, { tv: { artDisplay: Number(v) } })))
    row(b, 'Music backdrop', 'Framed Now Playing background',
      select([[1, 'Drift'], [3, 'Smoke'], [7, 'Marble'], [8, 'Mixtape'], [9, 'Music videos']],
        // Nothing stored means the TV is on its own default, Smoke (TVSettings.swift).
        // The removed styles (0, 2, 4, 5, 6) load as Smoke on the TV, so show them as Smoke.
        [1, 3, 7, 8, 9].includes(Number(tv.framedBackdrop)) ? tv.framedBackdrop : 3,
        (v) => patchDevice(dev.id, { tv: { framedBackdrop: Number(v) } })))

    const m = card('Mats', 'Picture-frame mat per view')
    for (const [key, label] of [['todayMatEnabled', 'Today mat'], ['photosMatEnabled', 'Photos mat']]) {
      row(m, label, '', select([[true, 'On'], [false, 'Off']], tv[key],
        (v) => patchDevice(dev.id, { tv: { [key]: v === 'true' } })))
    }
    row(m, 'Music mat', '', select([[0, 'Off'], [1, 'Fit'], [2, 'Framed']], tv.musicMatMode,
      (v) => patchDevice(dev.id, { tv: { musicMatMode: Number(v) } })))

    const d = card('Dimming')
    row(d, 'Auto dim', 'Sunset-anchored dimming curve',
      select([[true, 'On'], [false, 'Off']], tv.autoDim,
        (v) => patchDevice(dev.id, { tv: { autoDim: v === 'true' } })))
    row(d, 'Brightness', 'Used only when Auto dim is off',
      percentControl(tv.manualBrightness ?? 1.0,
        (v) => patchDevice(dev.id, { tv: { manualBrightness: v } }), { min: 20 }))
  } else {
    const s = cfg.slideshow || {}
    row(b, 'Photo duration', 'How long each photo stays up',
      select(DURATIONS, Math.round((s.intervalMs ?? 6000) / 1000),
        (v) => patchDevice(dev.id, { slideshow: { intervalMs: Number(v) * 1000 } })))
    row(b, 'Sort order', '',
      select([['random', 'Random'], ['date-taken', 'Date taken'], ['date-added', 'Date added']],
        s.sortOrder, (v) => patchDevice(dev.id, { slideshow: { sortOrder: v } })))
    row(b, 'Display mode', 'Smart picks per photo: fill when little is cropped',
      select([['smart', 'Smart'], ['fill', 'Fill'], ['fit', 'Fit']], s.displayMode,
        (v) => patchDevice(dev.id, { slideshow: { displayMode: v } })))
    row(b, 'Smart faces', 'Shift the crop so faces stay in frame',
      select([[true, 'On'], [false, 'Off']], s.smartFaces,
        (v) => patchDevice(dev.id, { slideshow: { smartFaces: v === 'true' } })))
    row(b, 'Caption auto-hide', 'Fade the location caption after a few seconds',
      select([[true, 'On'], [false, 'Off']], s.autoDismissExif,
        (v) => patchDevice(dev.id, { slideshow: { autoDismissExif: v === 'true' } })))

    // --- Today screen (web screens only; the tvOS app has its own Today) ---
    // 'framed' is the original Today view. The others live in
    // code/src/views/TodayLayouts/. Per screen, so the kitchen and a living
    // room screen can differ. Pixel shift is burn-in care for the static Board.
    const disp = cfg.display || {}
    const t = card('Today screen', 'Which Today layout this screen shows. Takes effect within about 10 seconds.')
    row(t, 'Layout', 'Framed is the original. Board, Briefing and Ambient are the 2026-09 layouts; Entry board is the front-door calendar board.',
      select([['framed', 'Framed (original)'], ['board', 'Board'], ['briefing', 'Briefing'], ['ambient', 'Ambient'],
        ['entry', 'Entry board'], ['clock', 'Flip clock']],
        disp.todayLayout || 'framed',
        (v) => patchDevice(dev.id, { display: { todayLayout: v } })))
    row(t, 'Pixel shift', 'Nudge the whole picture a pixel or two every few minutes. Recommended with Board.',
      select([[true, 'On'], [false, 'Off']], disp.pixelShift === true,
        (v) => patchDevice(dev.id, { display: { pixelShift: v === 'true' } })))

    // --- Entry board (web screens) ---
    // The front-door layout's look, and the view the screen rests on. Unset
    // values are the web app's defaults: photos behind, 50% darker, home is
    // Photos. See docs/designs/entry-board.md.
    if (isWeb) {
      const e = card('Entry board',
        'How the Entry board layout looks on this screen, and which view the screen rests on. Takes effect within about 10 seconds.')
      row(e, 'Photos behind the board', 'Black is the plain DAKboard look',
        select([['photos', 'Photos'], ['black', 'Black']], disp.entryBackdrop || 'photos',
          (v) => patchDevice(dev.id, { display: { entryBackdrop: v } })))
      row(e, 'Darken photos', 'A black wash over the photos so the board reads. Used only with photos behind it.',
        percentControl(disp.entryDim ?? 0.5,
          (v) => patchDevice(dev.id, { display: { entryDim: v } }), { min: 0, max: 90, debounceMs: 300 }))
      // Phase 1.5 (docs/designs/entry-board.md). Unset: adaptive on, no blur.
      row(e, 'Adapt darkness to each photo', 'Darker behind a bright photo, lighter behind a night one, around the darkness above',
        select([[true, 'On'], [false, 'Off']], disp.entryAdaptive !== false,
          (v) => patchDevice(dev.id, { display: { entryAdaptive: v === 'true' } })))
      // A pixel slider, built here rather than with percentControl (which is
      // for fractions), with the same debounce: saves once the thumb rests.
      const blurWrap = document.createElement('div')
      blurWrap.className = 'pct'
      const blur = document.createElement('input')
      blur.type = 'range'
      blur.min = 0
      blur.max = 20
      blur.step = 1
      blur.value = Math.round(Math.min(20, Math.max(0, Number(disp.entryBlur) || 0)))
      const blurOut = document.createElement('span')
      blurOut.className = 'pct-val'
      const blurText = () => (blur.value === '0' ? 'Off' : `${blur.value} px`)
      blurOut.textContent = blurText()
      let blurTimer = null
      let blurSent = blur.value
      const blurSoon = () => {
        blurOut.textContent = blurText()
        clearTimeout(blurTimer)
        blurTimer = setTimeout(() => {
          if (blur.value === blurSent) return
          blurSent = blur.value
          patchDevice(dev.id, { display: { entryBlur: Number(blur.value) } })
        }, 300)
      }
      blur.addEventListener('input', blurSoon)
      blur.onchange = blurSoon
      blur.onpointerdown = () => blur.focus()
      blurWrap.append(blur, blurOut)
      row(e, 'Blur photos', 'Soften the photos behind the board. Off keeps them sharp.', blurWrap)
      row(e, 'Home view', 'Where this screen rests outside the school morning. The front-door board wants Today.',
        select([['photos', 'Photos'], ['today', 'Today']], disp.homeView || 'photos',
          (v) => patchDevice(dev.id, { display: { homeView: v } })))
    }

    // --- Plex (web screens) ---
    // display.plexFollow: 'off' or a Plex player's machineIdentifier. The hub
    // lists every player it has seen in a Plex session (GET /api/plex/players),
    // fetched when the card is drawn. A saved player the hub no longer lists
    // stays selectable, so a redraw never changes the setting. See
    // frameserver/lib/plex.mjs and code/src/shell/AppShell.jsx (PlexFollow).
    if (isWeb) {
      const px = card('Plex',
        'Follow a Plex player: while it plays something, this screen shows what is on (title, episode, cast) and goes back a minute after it stops, once nobody is using it. Takes effect within about 10 seconds.')
      const cur = disp.plexFollow && disp.plexFollow !== 'off' ? disp.plexFollow : 'off'
      const sel = select([['off', 'Off'], ...(cur === 'off' ? [] : [[cur, 'Loading players…']])], cur,
        (v) => patchDevice(dev.id, { display: { plexFollow: v } }))
      row(px, 'Follow Plex player', 'Players appear once they have played something while the hub was running.', sel)
      // display.plexTextScale: the whole Plex view (type, headshots, posters)
      // scales by it, 0.8..1.6, unset 1. Steps of 10%, so a select (the
      // range helper steps by 5); a value saved off the steps stays listed.
      const pxScale = Math.round(Math.min(1.6, Math.max(0.8,
        typeof disp.plexTextScale === 'number' && Number.isFinite(disp.plexTextScale) ? disp.plexTextScale : 1)) * 100)
      const pxSteps = [80, 90, 100, 110, 120, 130, 140, 150, 160]
      if (!pxSteps.includes(pxScale)) pxSteps.push(pxScale)
      row(px, 'Plex text size', 'Everything on the Plex view: the words, the faces and the posters. 100% shows two rows of the cast.',
        select(pxSteps.sort((a, b) => a - b).map((p) => [p, `${p}%`]), pxScale,
          (v) => patchDevice(dev.id, { display: { plexTextScale: Number(v) / 100 } })))
      api('/api/plex/players').then(({ players = [] }) => {
        const named = (p) => (players.filter((q) => q.name === p.name).length > 1
          ? `${p.name} (${p.product || p.platform || p.machineId.slice(0, 8)})` : p.name)
        const opts = [['off', 'Off'], ...players.map((p) => [p.machineId, named(p)])]
        if (cur !== 'off' && !players.some((p) => p.machineId === cur)) {
          opts.push([cur, `Unknown player (${cur.slice(0, 8)})`])
        }
        while (sel.firstChild) sel.removeChild(sel.firstChild)
        for (const [v, text] of opts) {
          const o = document.createElement('option')
          o.value = v; o.textContent = text; o.selected = v === cur
          sel.appendChild(o)
        }
      }).catch(() => { /* a hub without /api/plex/players: Off (and the saved value) stay */ })
    }

    const d = card('Display', isEcho
      ? 'Brightness and the night schedule. Dimming is a black overlay here; off shows the night face.'
      : 'Panel brightness and the night schedule')
    row(d, 'Daytime brightness', '',
      percentControl(disp.wakeBrightness ?? 0.9,
        (v) => patchDevice(dev.id, { display: { wakeBrightness: v } })))
    if (!isEcho) {
      row(d, 'Hardware dimming', 'Dim the real backlight over HDMI (DDC/CI) instead of a black overlay',
        select([[true, 'On'], [false, 'Off']], disp.hardwareDim !== false,
          (v) => patchDevice(dev.id, { display: { hardwareDim: v === 'true' } })))
      row(d, 'Power off panel', 'At the off time, standby the panel instead of covering it. Touch still wakes it.',
        select([[true, 'On'], [false, 'Off']], disp.hardwarePowerOff !== false,
          (v) => patchDevice(dev.id, { display: { hardwarePowerOff: v === 'true' } })))
    }
    row(d, 'Evening brightness', 'After the dim time below',
      percentControl(disp.eveningBrightness ?? 0.4,
        (v) => patchDevice(dev.id, { display: { eveningBrightness: v } })))
    for (const [key, label] of [['dimAt', 'Dim at'], ['offAt', 'Off at'], ['wakeAt', 'Wake at']]) {
      row(d, label, '', timeControl(disp[key], (hm) => patchDevice(dev.id, { display: { [key]: hm } })))
    }
    // What the off window shows. Unset follows the app's default for the
    // kind: the Echo keeps a clock, everything else goes black.
    if (isWeb) {
      row(d, 'Night face', 'What the screen shows between Off and Wake. Clock is a faint time and date that drifts on black.',
        select([['black', 'Black'], ['clock', 'Clock']], disp.nightFace || (isEcho ? 'clock' : 'black'),
          (v) => patchDevice(dev.id, { display: { nightFace: v } })))
    }

    const so = card('Music')
    row(so, 'Sonos room', 'Which zone this screen controls',
      textControl((cfg.sonos || {}).room, (v) => patchDevice(dev.id, { sonos: { room: v } })))
  }

  // --- device management ---
  const dm = card('This screen', `id: ${dev.id}  ·  registered ${(dev.createdAt || '').slice(0, 10)}`)
  dm.querySelector('h2').appendChild(seenBadge(dev))
  row(dm, 'Name', 'Shown in this list only',
    textControl(dev.name, async (v) => {
      await api('/api/devices/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: dev.id, name: v }),
      })
      toast('Renamed'); loadAll()
    }))
  const del = document.createElement('button')
  del.className = 'danger'
  del.textContent = 'Remove from registry'
  del.onclick = async () => {
    if (!confirm(`Remove "${dev.name}"?\n\nIts settings here are deleted. If the screen is still running it will re-register and re-seed from whatever it has cached locally.`)) return
    await api(`/api/devices/${encodeURIComponent(dev.id)}`, { method: 'DELETE' })
    selected = null; toast('Removed'); loadAll()
  }
  row(dm, 'Remove', 'The screen re-registers itself if it is still running', del)
}

function timeControl(hm, onChange) {
  const el = document.createElement('input')
  el.type = 'time'
  const pad = (n) => String(n).padStart(2, '0')
  if (hm && typeof hm.hour === 'number') el.value = `${pad(hm.hour)}:${pad(hm.minute || 0)}`
  el.onchange = () => {
    const [h, m] = el.value.split(':').map(Number)
    if (!Number.isNaN(h)) onChange({ hour: h, minute: m || 0 })
  }
  return el
}

function textControl(value, onChange) {
  const el = document.createElement('input')
  el.type = 'text'; el.value = value ?? ''
  el.onchange = () => onChange(el.value)
  return el
}

// ---- House-wide: calendars, countdowns, headline, countdown art -----------
// docs/designs/entry-board.md. The calendar list is edited like everything
// else here; the status under it (GET /api/calendar, /api/state and
// /api/countdown-art) is read-only and repainted in place.

// A small element builder for the read-only blocks.
function make(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}

// A timestamp that updateAges() keeps current ("3 min ago"), warn-coloured
// once it is older than staleMs.
function ageSpan(iso, never, staleMs) {
  const e = make('span')
  e.dataset.ageAt = iso || ''
  e.dataset.never = never
  if (staleMs) e.dataset.staleMs = String(staleMs)
  return e
}

// A read-only row, laid out like row() and stacked the same way on a phone.
function infoRow(parent, label, value) {
  const r = make('div', 'row info')
  value.classList.add('v')
  r.append(make('div', 'k', label), value)
  parent.appendChild(r)
}

// Colours offered to a new calendar, first unused wins. The first two are the
// spec's Justin / Sheena example.
const CAL_COLORS = ['#e0457b', '#4a90e2', '#f5a623', '#3fae6a', '#8e5bd6', '#20a8a8', '#d0573a', '#7a8791']

// <input type=color> only takes #rrggbb.
function hexColor(c) {
  const s = String(c || '').trim().toLowerCase()
  if (/^#[0-9a-f]{6}$/.test(s)) return s
  if (/^#[0-9a-f]{3}$/.test(s)) return '#' + [...s.slice(1)].map((x) => x + x).join('')
  return '#888888'
}

// A whole number clamped to [min, max]. Empty or junk puts the last value back
// instead of saving it.
function intInput(value, min, max, onChange) {
  let last = value
  const el = numberInput(value, (v) => {
    const n = v == null || !Number.isFinite(v) ? last : Math.min(max, Math.max(min, Math.round(v)))
    el.value = n
    if (n === last) return
    last = n
    onChange(n)
  }, { min, max, step: 1 })
  return el
}

// shared.calendar = { calendars: [{ id, label, color }], countdownLeadDays,
// countdownMax }. The hub replaces arrays wholesale, so every save sends the
// whole list, with the two numbers alongside: one body shape for every edit.
function renderCalendars() {
  const stored = shared.calendar || {}
  // What this render's controls edit. Entries are copied whole, so a field the
  // dashboard does not show survives the replace.
  const model = {
    calendars: (Array.isArray(stored.calendars) ? stored.calendars : [])
      .map((x) => (typeof x === 'string' ? { id: x } : { ...x })),
    countdownLeadDays: stored.countdownLeadDays ?? 30,
    countdownMax: stored.countdownMax ?? 3,
  }
  // Each save replaces the whole list, so they go one at a time, each with the
  // list as it is when it leaves: quick edits (label, Tab, colour) cannot land
  // out of order and put an older list back.
  const save = () => {
    calSaving = calSaving.then(async () => {
      try {
        const merged = await patchShared({ calendar: {
          calendars: model.calendars,
          countdownLeadDays: model.countdownLeadDays,
          countdownMax: model.countdownMax,
        } })
        if (merged && typeof merged === 'object') shared = merged
      } catch (e) {
        // Show what the hub holds, not an edit that did not land.
        toast(`Not saved: ${e.message || e}`)
        loadAll().catch(() => {})
      }
    })
    return calSaving
  }

  const c = card('Calendars and countdowns',
    "The Google calendars every screen shows. Share each one (read-only) with the hub's service account first. " +
    "A calendar's ID is in Google Calendar under its Settings > Integrate calendar; a personal calendar's ID is its Gmail address.")

  const table = make('div', 'cal-table')
  const head = make('div', 'cal-head')
  for (const t of ['Calendar ID', 'Label', 'Colour', '']) head.appendChild(make('span', null, t))
  table.appendChild(head)
  const none = make('p', 'empty-note',
    'No calendars yet. Until one is added the agenda stays empty and the headline sticks to greetings.')
  const showEmpty = () => {
    const n = model.calendars.length + calDrafts.length
    table.hidden = n === 0
    none.hidden = n > 0
  }

  const addRow = (entry) => {
    const draft = () => calDrafts.includes(entry)
    const r = make('div', 'cal-row')
    const id = document.createElement('input')
    id.type = 'text'; id.className = 'cal-id'; id.value = entry.id ?? ''
    id.placeholder = 'Calendar ID, e.g. name@gmail.com'
    id.setAttribute('aria-label', 'Calendar ID')
    id.spellcheck = false; id.autocomplete = 'off'; id.inputMode = 'email'
    id.setAttribute('autocapitalize', 'off')
    const label = document.createElement('input')
    label.type = 'text'; label.value = entry.label ?? ''
    label.placeholder = 'Label, e.g. Justin'
    label.setAttribute('aria-label', 'Label')
    const color = document.createElement('input')
    color.type = 'color'; color.value = hexColor(entry.color)
    color.setAttribute('aria-label', 'Colour')
    const rm = make('button', 'action danger', 'Remove')
    rm.type = 'button'
    const note = make('div', 'draft-note', 'Not saved until it has a calendar ID.')
    r.append(id, label, color, rm)
    if (draft()) r.appendChild(note)

    id.onchange = () => {
      const v = id.value.trim()
      if (v && model.calendars.some((o) => o !== entry && o.id === v)) {
        id.value = entry.id ?? ''
        return toast('That calendar is already in the list')
      }
      if (!v) {
        id.value = entry.id ?? ''
        if (!draft()) toast('A calendar needs an ID. Use Remove to drop it.')
        return
      }
      id.value = v
      entry.id = v
      if (draft()) {
        calDrafts.splice(calDrafts.indexOf(entry), 1)
        model.calendars.push(entry)
        note.remove()
      }
      save()
    }
    label.onchange = () => {
      entry.label = label.value.trim()
      label.value = entry.label
      if (!draft()) save()
    }
    color.onchange = () => {
      entry.color = color.value
      if (!draft()) save()
    }
    rm.onclick = () => {
      if (draft()) {
        calDrafts.splice(calDrafts.indexOf(entry), 1)
      } else {
        if (!confirm(`Remove ${entry.label || entry.id} from every screen?`)) return
        model.calendars.splice(model.calendars.indexOf(entry), 1)
        save()
      }
      r.remove()
      showEmpty()
    }
    table.appendChild(r)
    return r
  }
  for (const entry of model.calendars) addRow(entry)
  for (const entry of calDrafts) addRow(entry)
  c.append(table, none)
  showEmpty()

  const bar = make('div', 'toolbar')
  const add = make('button', 'action ghost', 'Add calendar')
  add.type = 'button'
  add.onclick = () => {
    const used = new Set([...model.calendars, ...calDrafts].map((x) => hexColor(x.color)))
    const entry = { id: '', label: '', color: CAL_COLORS.find((x) => !used.has(x)) || CAL_COLORS[0] }
    calDrafts.push(entry)
    const r = addRow(entry)
    showEmpty()
    r.querySelector('.cal-id').focus()
  }
  bar.appendChild(add)
  c.appendChild(bar)

  row(c, 'Countdown lead days',
    'How early a countdown appears when its event says just "countdown". "countdown 14" in the description sets its own.',
    intInput(model.countdownLeadDays, 1, 365, (n) => { model.countdownLeadDays = n; save() }))
  row(c, 'Max countdown tiles', 'The most countdowns a screen shows at once, soonest first',
    intInput(model.countdownMax, 1, 6, (n) => { model.countdownMax = n; save() }))

  const st = make('div', 'status-block')
  const title = make('h3', null, 'On the hub now')
  title.appendChild(make('small', null, 'refreshes every minute'))
  const box = make('div')
  box.id = 'calStatus'
  st.append(title, box)
  c.appendChild(st)
}

// GET /api/countdown-art (lib/countdownArt.mjs status()): { album: { id, name }
// | null, syncedAt (the last good sync), error, running, items: [{ id, file,
// name, keywords, updatedAt, url }] }. A bare array (the index alone) works.
function artView() {
  const d = extras.art && extras.art.data
  if (Array.isArray(d)) return { items: d, album: null, albumId: null, syncedAt: null, error: null, running: false }
  const o = d && typeof d === 'object' ? d : {}
  const album = o.album && typeof o.album === 'object' ? o.album : { name: o.album }
  return {
    items: Array.isArray(o.items) ? o.items : [],
    album: album.name || null,
    albumId: o.albumId || album.id || null,
    syncedAt: o.syncedAt || null,
    error: o.error || null,
    running: !!o.running,
  }
}
